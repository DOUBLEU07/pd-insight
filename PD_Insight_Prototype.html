<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PD Insight: Partial Discharge Diagnostic System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     PD Insight - single-file walkthrough build.

     Every screen, class name, wording and rule below is taken from the
     running system (pd-insight/frontend: app/globals.css, the (app) routes
     and components/). The data is the real seed dataset, re-shaped exactly
     as the API's serialize_case() returns it, so this file behaves like the
     deployed app without a backend.
     ===================================================================== */
  :root{
    --brand-50:#EEF3F8; --brand-100:#DCE6EF; --brand-200:#B9CEE0; --brand-400:#4472A8; --brand-500:#1F4E79; --brand-600:#17395A; --brand-700:#102943;
    --corona:#F59E0B; --surfaceblue:#0EA5E9; --internal:#EF4444; --mixedpd:#A855F7; --nonid:#94A3B8;
    --emerald-50:#ECFDF5; --emerald-200:#A7F3D0; --emerald-500:#10B981; --emerald-600:#059669; --emerald-700:#047857;
    --red-50:#FEF2F2; --red-200:#FECACA; --red-700:#B91C1C;
    --amber-50:#FFFBEB; --amber-200:#FDE68A; --amber-700:#92400E;
    --slate-50:#F8FAFC; --slate-100:#F1F5F9; --slate-200:#E2E8F0; --slate-300:#CBD5E1; --slate-400:#94A3B8; --slate-500:#64748B; --slate-600:#475569; --slate-700:#334155; --slate-900:#0F172A;
    --font-body:'Kanit',-apple-system,'Segoe UI',sans-serif;
    --card-shadow:0 1px 2px rgba(15,23,42,.05), 0 4px 14px -6px rgba(15,23,42,.10);
    --popover-shadow:0 20px 44px -12px rgba(15,23,42,.28);
    --login-shadow:0 24px 56px -24px rgba(15,23,42,.20);
    --ease-emphasized:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  body{font-family:var(--font-body); margin:0; background:var(--slate-50); color:var(--slate-900); font-size:14px;}

  /* ---------- MOTION ---------- */
  @keyframes fadeInUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: no-preference){
    .card, .kpi-card, .quick-action-card{animation:fadeInUp .36s var(--ease-emphasized) both;}
    .kpi-grid .kpi-card:nth-child(2), .dash-section .card:nth-child(2), .quick-actions-grid .quick-action-card:nth-child(2){animation-delay:.04s;}
    .kpi-grid .kpi-card:nth-child(3), .dash-section .card:nth-child(3), .quick-actions-grid .quick-action-card:nth-child(3){animation-delay:.08s;}
    .kpi-grid .kpi-card:nth-child(4), .quick-actions-grid .quick-action-card:nth-child(4){animation-delay:.12s;}
    .wizard-2col{animation:fadeInUp .3s var(--ease-emphasized) both;}
  }

  /* ---------- SHELL ---------- */
  .app-shell{display:flex; min-height:100vh;}
  .sidebar{position:sticky; top:0; height:100vh; width:248px; flex-shrink:0; display:flex; flex-direction:column; border-right:1px solid var(--slate-200); background:#fff; padding:20px 14px; color:var(--slate-600);}
  .sidebar-logo{display:flex; align-items:center; gap:10px; padding:6px 8px 22px;}
  .sidebar-logo .mark{width:34px; height:34px; flex-shrink:0; border-radius:6px; background:var(--brand-500); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; color:#fff;}
  .sidebar-logo .name{font-size:15.5px; font-weight:600; line-height:1.2; color:var(--slate-900);}
  .sidebar-logo .tag{margin-top:1px; font-size:11px; color:var(--slate-400);}
  .sidebar-nav{margin-top:4px; display:flex; flex-direction:column; gap:3px;}
  .sidebar-nav button{position:relative; display:flex; width:100%; align-items:center; gap:11px; border:none; border-radius:6px; background:transparent; padding:10px 12px; text-align:left; font-family:inherit; font-size:13.5px; font-weight:500; color:var(--slate-500); cursor:pointer; transition:background-color .15s, color .15s, transform .15s;}
  .sidebar-nav button svg{width:17px; height:17px; flex-shrink:0; opacity:.85; transition:opacity .15s;}
  .sidebar-nav button:hover{transform:translateX(1px); background:var(--slate-100); color:var(--slate-900);}
  .sidebar-nav button.active{background:var(--brand-50); color:var(--brand-700);}
  .sidebar-nav button.active svg{color:var(--brand-500); opacity:1;}
  .sidebar-nav button::before{content:''; position:absolute; left:0; top:6px; bottom:6px; width:3px; border-radius:999px; background:var(--brand-500); opacity:0; transform:scaleY(0); transition:transform .2s var(--ease-emphasized), opacity .2s var(--ease-emphasized);}
  .sidebar-nav button.active::before{opacity:1; transform:scaleY(1);}
  .sidebar-spacer{flex:1;}
  .sidebar-foot{display:flex; flex-direction:column; gap:8px; padding-top:14px; border-top:1px solid var(--slate-200);}
  .sidebar-foot .link{display:flex; cursor:pointer; align-items:center; gap:9px; border-radius:6px; padding:6px 8px; font-size:12.5px; color:var(--slate-500); transition:background-color .15s, color .15s;}
  .sidebar-foot .link:hover{background:var(--slate-100); color:var(--slate-900);}
  .account-chip{margin-top:4px; display:flex; align-items:center; gap:8px; border:1px solid var(--slate-200); border-radius:6px; background:var(--slate-100); padding:9px 11px; font-size:11.5px; color:var(--slate-600);}
  .account-chip .avatar{width:22px; height:22px; flex-shrink:0; border-radius:50%; background:var(--brand-500); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff;}
  .account-chip b{color:var(--slate-900);}
  .account-chip .role{text-transform:capitalize; color:var(--slate-400);}

  .main-col{display:flex; min-width:0; flex:1; flex-direction:column;}
  .topbar{position:sticky; top:0; z-index:40; display:flex; min-height:78px; flex-shrink:0; align-items:center; justify-content:space-between; gap:20px; overflow:hidden; padding:14px 28px; background:linear-gradient(115deg,var(--brand-700),var(--brand-500) 55%,var(--brand-400));}
  .topbar h1{margin:0; font-size:20px; font-weight:600; color:#fff;}
  .topbar .sub{margin-top:1px; font-size:12px; color:var(--brand-100);}
  .topbar-scatter{position:absolute; inset:0; opacity:.6; pointer-events:none;}
  .topbar-titles{position:relative; z-index:1;}
  .topbar-right{position:relative; z-index:1; display:flex; flex-shrink:0; align-items:center; gap:16px;}
  .topbar-help-btn{display:flex; height:28px; width:28px; align-items:center; justify-content:center; border-radius:50%; border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.16); padding:0; font-family:inherit; font-size:13px; font-weight:800; color:#fff; cursor:pointer;}
  .hero-logo-row{display:flex; gap:8px;}
  .hero-logo-slot{display:flex; height:46px; align-items:center; justify-content:center; border-radius:5px; border:1px solid rgba(255,255,255,.6); background:rgba(255,255,255,.94); padding:5px 10px;}
  .hero-logo-slot img{height:100%; width:auto; object-fit:contain;}
  @media (max-width:720px){.hero-logo-row{display:none;}}
  main.content{margin:0 auto; width:100%; max-width:1560px; flex:1; padding:24px 32px 60px;}
  footer.note{padding:24px; text-align:center; font-size:11.5px; color:var(--slate-400);}
  footer.note .disclaimer{margin:0 auto; max-width:820px; border:1px solid var(--amber-200); border-radius:6px; background:var(--amber-50); padding:9px 14px; font-size:12px; font-weight:600; line-height:1.5; color:var(--amber-700);}

  /* ---------- CARDS ---------- */
  .card{margin-bottom:20px; border:1px solid var(--slate-100); border-radius:8px; background:#fff; padding:22px 24px; box-shadow:var(--card-shadow);}
  .card h2{margin:0 0 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--slate-100); padding-bottom:14px; font-size:16px; font-weight:600; color:var(--slate-900);}
  .card h2 .sub-note{font-size:11px; font-weight:500; color:var(--slate-400);}
  .card .hint, p.hint{margin:0 0 14px; font-size:12.5px; line-height:1.5; color:var(--slate-400);}
  .locked-banner{margin-bottom:10px; border:1px solid var(--slate-200); border-radius:6px; background:var(--slate-50); padding:10px 14px; font-size:12.5px; line-height:1.5; color:var(--slate-600);}
  .locked-banner.amber{border-color:var(--amber-200); background:var(--amber-50); color:var(--amber-700);}
  .locked-banner.red{border-color:var(--red-200); background:var(--red-50); color:var(--red-700);}
  .locked-banner.brand{border-color:var(--brand-100); background:var(--brand-50); color:var(--brand-600);}
  .locked-banner.green{border-color:var(--emerald-200); background:var(--emerald-50); color:var(--emerald-700);}
  .locked-banner ul{margin:4px 0 0; padding-left:18px;}
  .row{display:flex; flex-wrap:wrap; gap:20px;}
  .col{min-width:240px; flex:1;}
  code{border-radius:4px; background:var(--slate-100); padding:1px 5px; font-size:11.5px; color:var(--slate-700);}

  /* ---------- CONFIDENCE BARS ---------- */
  .conf-row{margin-bottom:10px; display:flex; align-items:center; gap:10px;}
  .conf-label{width:62px; font-size:12.5px; font-weight:600; color:var(--slate-600);}
  .conf-bar-bg{height:8px; flex:1; overflow:hidden; border-radius:999px; background:var(--slate-100);}
  .conf-bar-fill{height:100%; border-radius:999px; transition:width .7s var(--ease-emphasized);}
  .conf-row:nth-of-type(2) .conf-bar-fill{transition-delay:60ms;}
  .conf-row:nth-of-type(3) .conf-bar-fill{transition-delay:120ms;}
  .conf-val{width:52px; text-align:right; font-size:12.5px; font-weight:700; color:var(--slate-900);}
  .fill-corona{background:var(--corona);} .fill-surface{background:var(--surfaceblue);} .fill-internal{background:var(--internal);}

  /* ---------- TABLES ---------- */
  table.kv{width:100%; border-collapse:collapse; font-size:13px;}
  table.kv td{border-bottom:1px solid var(--slate-100); padding:8px 4px; vertical-align:top;}
  table.kv td.k{width:44%; font-size:12px; color:var(--slate-400);}
  table.kv td.group-head{border-bottom:2px solid var(--slate-200); background:var(--slate-50); font-weight:700; color:var(--slate-700);}
  table.data{width:100%; border-collapse:collapse; font-size:13px;}
  table.data th{border-bottom:1px solid var(--slate-100); background:transparent; padding:10px 12px; text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--slate-400);}
  table.data td{border-bottom:1px solid var(--slate-50); padding:11px 12px;}
  table.data tr:hover td{background:var(--slate-50);}
  .scroll-table-wrap{max-height:280px; overflow-y:auto; border:1px solid var(--slate-100); border-radius:6px;}
  .scroll-y-320{max-height:320px; overflow-y:auto;}
  .scroll-y-420{max-height:420px; overflow-y:auto;}
  .scroll-y-520{max-height:520px; overflow-y:auto;}

  /* ---------- PILLS / STATUS ---------- */
  .pill{display:inline-flex; align-items:center; border-radius:4px; padding:3px 11px; font-size:11.5px; font-weight:700;}
  .pill-green{background:var(--emerald-50); color:var(--emerald-700);}
  .pill-red{background:var(--red-50); color:var(--red-700);}
  .pill-amber{background:var(--amber-50); color:var(--amber-700);}
  .pill-gray{background:var(--slate-100); color:var(--slate-500);}
  .status-badge{display:inline-flex; align-items:center; gap:6px;}
  .status-dot{height:7px; width:7px; flex-shrink:0; border-radius:50%;}
  .status-pending{font-weight:500; color:var(--slate-400);}
  .status-pending .status-dot{background:var(--slate-300);}
  .status-in_review{font-weight:700; color:var(--corona);}
  .status-in_review .status-dot{background:var(--corona);}
  .status-done{font-weight:700; color:var(--emerald-600);}
  .status-done .status-dot{background:var(--emerald-500);}

  /* ---------- FORMS ---------- */
  select, input[type=text], input[type=number], input[type=password], textarea{width:100%; border:1px solid var(--slate-200); border-radius:6px; background:#fff; padding:8px 11px; font-family:inherit; font-size:13px; color:var(--slate-900);}
  select:focus, input[type=text]:focus, input[type=number]:focus, input[type=password]:focus, textarea:focus{outline:none; border-color:var(--brand-400); box-shadow:0 0 0 3px var(--brand-50);}
  textarea{min-height:54px; resize:vertical;}
  label.field-label{display:block; margin-bottom:5px; font-size:11.5px; font-weight:600; color:var(--slate-500);}
  .field{margin-bottom:13px;}
  input.inline{width:auto;}

  /* ---------- BUTTONS ---------- */
  .btn{display:inline-flex; cursor:pointer; align-items:center; gap:7px; border:none; border-radius:6px; padding:9px 17px; font-family:inherit; font-size:13px; font-weight:600; line-height:1; transition:background-color .15s, color .15s, border-color .15s, opacity .15s, transform .15s, box-shadow .15s;}
  .btn:not(:disabled):hover{transform:translateY(-1px); box-shadow:var(--card-shadow);}
  .btn:active{transform:translateY(0); opacity:.85; transition-duration:60ms;}
  .btn:disabled{cursor:not-allowed; opacity:.4;}
  .btn-icon{height:15px; width:15px; flex:none;}
  .btn-blue{background:var(--brand-500); color:#fff;} .btn-blue:not(:disabled):hover{background:var(--brand-600);}
  .btn-green{background:var(--emerald-500); color:#fff;} .btn-green:not(:disabled):hover{background:var(--emerald-600);}
  .btn-red{background:var(--internal); color:#fff;} .btn-red:not(:disabled):hover{background:#DC2626;}
  .btn-outline{border:1px solid var(--slate-200); background:#fff; color:var(--slate-700);}
  .btn-outline:not(:disabled):hover{border-color:var(--slate-300); background:var(--slate-50);}
  .btn-outline.danger{border-color:var(--red-200); color:var(--internal);}
  .small-link{cursor:pointer; font-size:12.5px; font-weight:500; color:var(--brand-600);}
  button.small-link{border:none; background:transparent; padding:0; font-family:inherit;}
  .small-link:hover{text-decoration:underline;}
  .small-link.danger{color:var(--internal);}
  .opt-toggle{display:inline-flex; overflow:hidden; border:1px solid var(--slate-200); border-radius:4px; font-size:12px;}
  .opt-toggle button{cursor:pointer; border:none; background:#fff; padding:6px 13px; font-family:inherit; font-weight:600; color:var(--slate-600);}
  .opt-toggle button.active{background:var(--brand-500); color:#fff;}

  /* ---------- READOUTS ---------- */
  .readout-grid{margin-top:10px; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;}
  .readout-box{border:1px solid var(--slate-100); border-radius:6px; background:var(--slate-50); padding:10px 12px;}
  .readout-box .lbl{font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--slate-400);}
  .readout-box .val{margin-top:2px; font-size:16px; font-weight:700; color:var(--slate-900);}
  .readout-box .val.sm{font-size:13px;} .readout-box .val.md{font-size:15px;} .readout-box .val.xs{font-size:12.5px;}
  .readout-box input{border-color:transparent; background:transparent; padding:3px 6px; font-size:14px; font-weight:700;}
  .readout-box input:hover{border-color:var(--slate-300);}
  .readout-box input:focus{border-color:var(--brand-400); background:#fff;}

  /* ---------- CANVAS ---------- */
  canvas{max-width:100%; border:1.5px solid var(--slate-200); border-radius:8px; background:#fff;}
  .canvas-wrap{position:relative; display:inline-block;}
  .nudge-row{margin-top:10px; display:flex; flex-wrap:wrap; gap:10px; font-size:12px;}
  .nudge-grp{display:flex; align-items:center; gap:6px; border:1px solid var(--slate-200); border-radius:8px; background:var(--slate-50); padding:4px 8px; font-weight:600; color:var(--slate-600);}
  .nudge-grp button{height:20px; width:20px; cursor:pointer; border:1px solid var(--slate-300); border-radius:6px; background:#fff; font-family:inherit; font-size:12px; font-weight:700; line-height:1; color:var(--slate-600);}
  .nudge-grp button:hover:not(:disabled){border-color:var(--brand-400); background:var(--brand-50); color:var(--brand-600);}
  .nudge-grp button:disabled{opacity:.4; cursor:not-allowed;}

  /* ---------- UPLOAD ---------- */
  .upload-box{cursor:pointer; border:1.5px dashed var(--slate-300); border-radius:8px; background:var(--slate-50); padding:16px; text-align:center; transition:background-color .15s, border-color .15s, transform .15s;}
  .upload-box:hover{transform:translateY(-1px); border-color:var(--brand-400); background:var(--brand-50);}
  .upload-box.filled{border-style:solid; border-color:var(--emerald-200); background:var(--emerald-50);}
  .upload-box.invalid{border-style:solid; border-color:var(--red-200); background:var(--red-50);}
  .upload-box-icon{margin-bottom:6px; display:flex; justify-content:center; color:var(--slate-400);}
  .upload-box.filled .upload-box-icon{color:var(--emerald-500);}
  .upload-box.invalid .upload-box-icon{color:var(--internal);}
  .upload-box-title{font-size:12.5px; font-weight:700; color:var(--slate-700);}
  .upload-box.filled .upload-box-title{color:var(--emerald-700);}
  .upload-box.invalid .upload-box-title{color:var(--red-700);}
  .upload-box-desc{margin-top:3px; font-size:11px; line-height:1.4; color:var(--slate-400);}
  .upload-box-thumb{margin:0 auto 6px; display:block; max-height:90px; max-width:100%; border-radius:4px; border:1px solid var(--emerald-200);}
  .inference-mode-row{margin:12px 0; display:flex; align-items:center; justify-content:space-between; border-radius:6px; background:var(--slate-50); padding:9px 13px; font-size:12.5px; font-weight:600; color:var(--slate-600);}
  .inference-badge{border-radius:4px; background:var(--brand-500); padding:3px 11px; font-size:11px; font-weight:700; letter-spacing:.02em; color:#fff;}

  /* ---------- KPI / DASHBOARD ---------- */
  .kpi-grid{margin-bottom:24px; display:flex; flex-wrap:wrap; gap:16px;}
  .kpi-card{position:relative; min-width:160px; max-width:300px; flex:1; overflow:hidden; border-radius:8px; background:#fff; padding:16px 20px; box-shadow:var(--card-shadow);}
  .kpi-accent{position:absolute; left:0; top:0; bottom:0; width:4px;}
  .kpi-label{font-size:12px; font-weight:500; color:var(--slate-400);}
  .kpi-value{margin-top:4px; font-size:28px; font-weight:800; line-height:1.1; color:var(--slate-900);}
  .kpi-sub{margin-top:6px; font-size:11px; color:var(--slate-400);}
  .dash-section{margin-bottom:26px;}
  .dash-section-head{margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}
  .dash-section-head h2{margin:0; font-size:16px; font-weight:600; color:var(--slate-900);}
  .view-all-link{cursor:pointer; font-size:12.5px; font-weight:600; color:var(--brand-600);}
  .view-all-link:hover{color:var(--brand-700); text-decoration:underline;}
  .quick-actions-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  .quick-action-card{cursor:pointer; border:1px solid var(--slate-100); border-radius:8px; background:#fff; padding:18px 20px; text-align:left; font-family:inherit; transition:border-color .15s, box-shadow .15s, transform .15s;}
  .quick-action-card:hover{transform:translateY(-1px); border-color:var(--slate-200); box-shadow:var(--card-shadow);}
  .quick-action-icon{margin-bottom:10px; display:inline-flex; height:36px; width:36px; align-items:center; justify-content:center; border-radius:6px;}
  .quick-action-title{font-size:13.5px; font-weight:700; color:var(--slate-900);}
  .quick-action-desc{margin-top:3px; font-size:12px; color:var(--slate-400);}
  @media (max-width:900px){.quick-actions-grid{grid-template-columns:1fr;}}
  .history-card{margin-bottom:10px; display:flex; flex-wrap:wrap; align-items:center; gap:16px; padding:14px 20px;}
  .history-name{font-size:13px; font-weight:700; color:var(--slate-900);}
  .history-name .kind{margin-left:4px; font-size:11.5px; font-weight:500; color:var(--slate-400);}
  .history-meta{margin-top:2px; font-size:11.5px; color:var(--slate-400);}
  .severity-card{margin-bottom:14px; overflow:hidden; padding:0;}
  .severity-card-head{display:flex; align-items:center; justify-content:space-between; padding:14px 20px 0;}
  .severity-card-head .label{font-size:12.5px; font-weight:700; color:var(--slate-700);}

  .progress-wrap{height:8px; width:160px; overflow:hidden; border-radius:999px; background:var(--slate-100);}
  .progress-bar{height:100%; border-radius:999px; background:var(--brand-500);}
  .topfilters{margin-bottom:14px; display:flex; flex-wrap:wrap; align-items:center; gap:14px;}
  .topfilters label{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--slate-500);}
  .topfilters select{width:auto; min-width:150px;}
  .case-nav-bar{margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; border:1px solid var(--brand-100); border-radius:8px; background:var(--brand-50); padding:12px 18px; font-size:13px; color:var(--brand-700);}
  .queue-step-grp{display:inline-flex; overflow:hidden; border:1px solid var(--brand-200); border-radius:4px;}
  .queue-step-grp button{cursor:pointer; border:none; background:#fff; padding:3px 10px; font-family:inherit; font-size:13px; line-height:1.4; color:var(--brand-600); transition:background-color .15s;}

  .wizard-step-btn.done .wizard-step-no{background:var(--emerald-500);}

  .callout-red{border-color:var(--red-200); background:var(--red-50); color:var(--red-700);}

  .help-checklist li b{color:var(--slate-700);}
  .help-bullets li{padding-left:16px;}
  .help-bullets li::before{content:''; position:absolute; left:3px; top:8px; height:4px; width:4px; border-radius:50%; background:var(--slate-300);}

  /* ---------- HELP POPOVER ---------- */
  .help-popover{position:fixed; right:32px; top:92px; z-index:300; width:820px; max-width:calc(100vw - 32px); max-height:min(780px,calc(100vh - 32px)); overflow-y:auto; scroll-behavior:smooth; border:1px solid var(--slate-200); border-radius:8px; background:#fff; padding:18px 22px 20px; font-size:12.5px; line-height:1.6; color:var(--slate-600); box-shadow:var(--popover-shadow);}

  .help-popover p.lede{margin:0 0 14px; font-size:12px; color:var(--slate-400);}

/* =========================================================================
   RULE ENGINE  (app/services/rules.py)
   ========================================================================= */
const SEVERITY_GROUP_1 = ['Floating / Corona / Bad contact', 'Outside surface discharge'];
const SEVERITY_GROUP_2 = ['Terminations / Joint', 'Internal'];

function gapTimeBand(ms) {
  const t = T();
  if (ms === null || ms === undefined || Number.isNaN(ms)) return 'Not measurable';
  if (ms > t.gap_time_moderate_ms) return `> ${Number(t.gap_time_moderate_ms)} ms`;
  if (ms >= t.gap_time_high_ms) return `${Number(t.gap_time_high_ms)}-${Number(t.gap_time_moderate_ms)} ms`;
  return `< ${Number(t.gap_time_high_ms)} ms`;
}

function severityFrom(ms, source) {
  const t = T();
  if (ms === null || ms === undefined || Number.isNaN(ms)) return 'Not measurable';
  if (SEVERITY_GROUP_1.includes(source)) {
    if (ms > t.gap_time_moderate_ms) return 'Initial';
    if (ms >= t.gap_time_high_ms) return 'Moderate';
    return 'High';
  }
  if (SEVERITY_GROUP_2.includes(source)) return ms > t.gap_time_moderate_ms ? 'Moderate' : 'High';
  return 'Unknown';
}

function severityGroupLabel(source) {
  if (SEVERITY_GROUP_1.includes(source)) return 'Group 1: Corona / Surface';
  if (SEVERITY_GROUP_2.includes(source)) return 'Group 2: Joint / Internal';
  return 'Unknown group';
}

function mapClassToPdSource(cls) {
  if (cls === 'Corona') return 'Floating / Corona / Bad contact';
  if (cls === 'Surface') return 'Outside surface discharge';
  if (cls === 'Internal') return 'Internal';
  return 'Manual confirmation required';
}

/** Five-rule priority cascade (CMD FINAL CODE). */
function selectPdSource(corona, surface, internal) {
  const t = T();
  const dual = t.joint_dual_threshold;
  const strong = t.strong_rule_threshold;
  const g = (n) => String(Number(n));
  if (surface > dual && internal > dual)
    return {
      pd_rule_class: 'Joint',
      pd_source_type: 'Terminations / Joint',
      pd_selection_rule: `surface_gt_${g(dual)}_and_internal_gt_${g(dual)}`,
      is_strong_rule: true,
    };
  if (corona > strong)
    return {
      pd_rule_class: 'Corona',
      pd_source_type: 'Floating / Corona / Bad contact',
      pd_selection_rule: `corona_gt_${g(strong)}`,
      is_strong_rule: true,
    };
  if (surface > strong)
    return {
      pd_rule_class: 'Surface',
      pd_source_type: 'Outside surface discharge',
      pd_selection_rule: `surface_gt_${g(strong)}`,
      is_strong_rule: true,
    };
  if (internal > strong)
    return {
      pd_rule_class: 'Internal',
      pd_source_type: 'Internal',
      pd_selection_rule: `internal_gt_${g(strong)}`,
      is_strong_rule: true,
    };
  const scores = { Corona: corona, Surface: surface, Internal: internal };
  const top = Object.keys(scores).reduce((a, b) => (scores[a] >= scores[b] ? a : b));
  return {
    pd_rule_class: top,
    pd_source_type: mapClassToPdSource(top),
    pd_selection_rule: `top_class_fallback_${top.toLowerCase()}_${scores[top].toFixed(2)}_manual_confirm`,
    is_strong_rule: false,
  };
}

/** CMD FINAL CODE `build_ai_result`, the production rule. */
function decideTopClass30(corona, surface, internal) {
  const t = T();
  const scores = { Corona: corona, Surface: surface, Internal: internal };
  const top = Object.keys(scores).reduce((a, b) => (scores[a] >= scores[b] ? a : b));
  const topScore = scores[top];
  const overThreshold = Object.values(scores).filter((v) => v > t.topclass_threshold).length;
  const identified = topScore > t.topclass_threshold;
  return {
    ai_top_class: top,
    ai_top_score_percent: round2(topScore),
    ai_final_result: identified ? top : 'Non-identified',
    ai_final_score_percent: round2(topScore),
    ai_status: identified ? 'identified_by_top_class_gt_30' : 'non_identified_all_classes_le_30',
    ai_high_conf_count: overThreshold,
    ai_non_identified_percent: identified ? 0 : round2(100 - topScore),
    ai_decision_rule: 'top_class_gt_30_else_non_identified',
    ai_threshold_percent: t.topclass_threshold,
  };
}

const round2 = (v) => (v === null || v === undefined ? null : Math.round(v * 100) / 100);

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmt(value, digits = 2, suffix = '') {
  if (value === null || value === undefined || Number.isNaN(value)) return '-';
  return `${Number(value).toFixed(digits)}${suffix}`;
}

function fmtDate(value) {
  if (!value) return '-';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return value;
  return d.toLocaleString('en-GB', {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
  });
}

  if (sev === 'High') return 'pill-red';
  if (sev === 'Moderate') return 'pill-amber';
  if (sev === 'Initial') return 'pill-green';

  if (result === 'Non-identified' || result === 'Inconclusive') return 'pill-amber';
  if (result === 'Mixed PD Suspected') return 'pill-red';
  if (!result) return 'pill-gray';
  return 'pill-green';
}

function severityBucket(sev) {
  if (sev === 'High' || sev === 'Moderate' || sev === 'Initial') return sev;
  return 'Pending';

/** True when `dateStr` falls inside the selected rolling window. */
function withinDateFilter(dateStr, filter) {
  if (filter === 'all' || !dateStr) return true;
  const t = new Date(dateStr).getTime();
  if (Number.isNaN(t)) return true;
  if (filter === 'today') {
    const start = new Date();
    start.setHours(0, 0, 0, 0);
    return t >= start.getTime();
  }
  const days = filter === '3d' ? 3 : 7;
  return t >= Date.now() - days * 86400000;
}

  try {
    const [version, date] = (localStorage.getItem(TERMS_VERSION_KEY) || '').split('|');

}

function scorePasswordStrength(pw) {
  let score = 0;
  if (pw.length >= 6) score++;
  if (pw.length >= 10) score++;
  if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  return Math.min(score, 4);
}

        ${u.capsLock ? `<div class="capslock-warning">${ICON.capslock(13)} Caps Lock is on</div>` : ''}
        ${
          u.mode === 'signup' && u.password
            ? `<div class="mt-3">
                 <div class="pw-strength-bar-bg">${[0, 1, 2, 3]
                   .map((i) => `<div class="pw-strength-segment" style="background:${i <= score ? meta.color : '#E2E8F0'}"></div>`)
                   .join('')}</div>
                 <div class="t11 muted" style="margin-top:6px;">Strength: ${meta.label}</div>
               </div>`
            : ''
        }
      </div>
      ${
        u.mode === 'signup'
          ? `<div class="field">
               <label class="field-label">Role</label>
               <select id="authRole">${ROLES.map(
                 (r) => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${r.charAt(0).toUpperCase() + r.slice(1)}</option>`,
               ).join('')}</select>
               <p class="t11 muted" style="margin:6px 0 0; line-height:1.5;">Role is recorded as the reviewer label on every case you sign off. It does not restrict what you can do in the system.</p>
             </div>`
          : ''
      }
      <button class="btn btn-blue" style="width:100%; justify-content:center;" data-act="auth-submit" type="button" ${u.busy ? 'disabled' : ''}>${
        u.busy ? 'Please wait…' : u.mode === 'signup' ? 'Sign Up' : 'Sign In'
      }</button>
    </div>
  </div>`;
}

function readLoginInputs() {
  const un = document.getElementById('authUsername');
  const pw = document.getElementById('authPassword');
  const role = document.getElementById('authRole');
  if (un) state.ui.username = un.value;
  if (pw) state.ui.password = pw.value;
  if (role) state.ui.role = role.value;
}

function submitAuth() {
  readLoginInputs();
  const u = state.ui;
  if (!(u.username || '').trim() || !u.password) {
    u.error = 'Please enter both username and password.';
    render();
    return;
  }
  u.busy = true;
  u.error = '';
  render();
  setTimeout(() => {
    state.user = { username: u.username.trim(), role: u.mode === 'signup' ? u.role || 'researcher' : 'researcher' };
    logUsage(u.mode === 'signup' ? 'signup' : 'login', u.mode === 'signup' ? state.user.role : '');
    state.route = { name: 'dashboard' };
    state.ui = {};
    state.consentOpen = !getAcceptedTermsToday();
    if (state.consentOpen) state.ui.consent = { terms: false, data: getDataConsent() };
    render();
  }, 420);
}

function signOut() {
  logUsage('logout', '');
  state.user = null;
  state.helpOpen = false;
  state.consentOpen = false;
  state.route = { name: 'login' };
  state.ui = { mode: 'login', username: '', password: '', role: 'researcher' };
  render();
}

function logUsage(action, detail) {
  state.usageLog.unshift({
    timestamp: new Date().toISOString(),
    username: state.user ? state.user.username : '-',
    action,
    detail: detail || '',
  });
}

function logEdit(caseName, field, oldValue, newValue) {
  state.editHistory.unshift({
    timestamp: new Date().toISOString(),
    case_base_name: caseName,
    changed_field: field,
    old_value: oldValue === null || oldValue === undefined ? '' : String(oldValue),
    new_value: newValue === null || newValue === undefined ? '' : String(newValue),
    changed_by: state.user ? state.user.username : '-',
  });
}

/* =========================================================================
   HELP POPOVER  (components/shell/HelpPopover.tsx)
   ========================================================================= */
const HELP_SECTIONS = [
  { id: 'help-about', label: 'About' },
  { id: 'help-theory', label: 'PD Fundamentals' },
  { id: 'help-workflow', label: 'Workflow' },
  { id: 'help-classification', label: 'Classification' },
  { id: 'help-severity', label: 'Gap-Time & Severity' },
  { id: 'help-limits', label: 'Scope & Limitations' },
  { id: 'help-data', label: 'Data Handling' },
  { id: 'help-refs', label: 'References' },
];

function helpPopoverHTML() {
  const c = options().constants;
  const topclass = c.topclass_threshold;
  const confidence = c.confidence_threshold;
  const internalHigh = c.internal_high_confidence;
  const cycle = c.cycle_time_ms;
  const dual = c.joint_dual_threshold;
  const strong = c.strong_rule_threshold;
  const highMs = c.gap_time_high_ms;
  const moderateMs = c.gap_time_moderate_ms;
  const deg = (ms) => Math.round((ms * 360) / cycle);

  return `
  <div class="help-popover" role="tooltip" id="helpPopover">
    <button class="close-x" aria-label="Close" data-act="help-close" type="button">×</button>
    <h3>Help &amp; Reference</h3>
    <p class="lede">What PD Insight is, how a case moves through the workflow, and where the limits of the analysis lie.</p>
    <div class="help-toc">
      ${HELP_SECTIONS.map((s) => `<button data-act="help-jump" data-to="${s.id}" type="button">${s.label}</button>`).join('')}
    </div>
    <div class="callout callout-red" style="margin-bottom:16px;"><b>The AI output is a preliminary assessment, not a diagnosis.</b> Every suggestion on this system must be reviewed together with the original measurement data and confirmed by a qualified engineer before it is used for any maintenance or engineering decision.</div>

    <section id="help-about">
      <h4>What Is PD Insight?</h4>
      <p>PD Insight classifies partial discharge (PD) defects from PRPD (Phase-Resolved Partial Discharge) plots. A classification model scores each case against three defect classes (<b>Corona</b>, <b>Surface</b> and <b>Internal</b>), and a rule engine combines those confidence scores with a gap-time measurement to suggest a PD source and a severity rating. Every automated suggestion stays traceable and editable by a human reviewer before it is saved.</p>
      <p>The intended use is <b>preliminary screening</b>: obtaining a first suggestion and reducing the workload of reviewing large volumes of PD data. It does not replace expert diagnosis.</p>
    </section>

    <section id="help-theory">
      <h4>PD Fundamentals</h4>
      <h5>What partial discharge is, and how it is measured</h5>
      <p>PD is a localised electrical discharge inside an insulation system under high electric stress, and it is an early indication of insulation degradation. Under IEC 60270 [1], PD measurement is a charge-based method whose main measured quantity is the <b>apparent charge</b>. In cable terminations, PD can be initiated by voids, sharp conductive points, surface contamination, improper installation, or material defects. Because the insulation condition of an underground cable cannot be observed directly during operation, PD analysis is one of the few practical routes to early defect detection.</p>
      <h5>Reading a PRPD pattern</h5>
      <p>A PRPD pattern displays PD activity against the phase angle of the applied voltage. The horizontal axis is the phase angle from <b>0° to 360°</b>; the vertical axis is the PD amplitude, expressed in pC or mV depending on the measuring system. The sinusoid is the applied-voltage phase reference, and the scattered points are the high-frequency PD pulses picked up by the sensor. Interpretation rests on five features: <b>phase position</b>, <b>polarity</b>, <b>amplitude</b>, <b>pulse density</b> and <b>cluster distribution</b>.</p>
      <h5>Distinguishing the three PD sources</h5>
      <p>The table below summarises the general PRPD characteristics used to separate the three classes, following the CIGRE knowledge rules [2], [3]. It is interpretation guidance for the reviewer: the models themselves learn from labelled images and do not evaluate these rules explicitly.</p>
      <table class="data">
        <thead><tr><th>Class</th><th>Typical PRPD appearance</th><th>PD source reported</th></tr></thead>
        <tbody>
          <tr><td><b>Corona</b></td><td>Strongly asymmetric between the two half-cycles, with activity concentrated in a narrow phase band near one voltage peak, usually with small, very uniform amplitudes and a high repetition rate. Caused by a sharp point or a floating/poorly bonded metal part discharging into gas.</td><td>Floating / Corona / Bad contact</td></tr>
          <tr><td><b>Surface</b></td><td>Activity in both half-cycles but unequal between them, spread over a wide phase range and often with a broad amplitude spread. Caused by discharge tracking along an insulation surface: contamination, moisture, or a damaged/scrubbed surface.</td><td>Outside surface discharge</td></tr>
          <tr><td><b>Internal</b></td><td>Two clusters of similar shape and amplitude, roughly symmetric between the positive and negative half-cycles and sitting on the rising slopes of the voltage waveform. Caused by discharge inside a void or cavity within the insulation.</td><td>Internal</td></tr>
        </tbody>
      </table>
      <p>A fourth outcome, <b>Terminations / Joint</b>, is not a model class: the rule engine reports it when Surface and Internal confidence are both above ${dual}%, which indicates a defect in the accessory itself rather than a single clean source. A single class above ${strong}% is reported as a <b>strong rule</b>; anything weaker is flagged as needing the reviewer's confirmation. Both figures, and the severity bands below, can be tuned per account on the Settings page.</p>
      <h5>Time-Frequency Map (TF Map)</h5>
      <p>A TF Map describes individual PD pulses by their waveform characteristics in both the time and frequency domains [9]. Detected pulses are converted to time-frequency features and plotted as groups by similarity, so pulses from different PD sources, or from external noise, can be separated more clearly than with the phase-resolved pattern alone. The technique is used in commercial PD instruments, notably TECHIMP-based systems.</p>
      <h5>Gap-time</h5>
      <p>Gap-time is the time separation between two discharge clusters that appear in <b>opposite polarity regions</b> of the same phase-resolved pattern [7], [8]. It is measured in milliseconds, from the end boundary of the first cluster to the starting boundary of the following cluster. PD amplitude and pulse repetition can shift with sensor response, trigger setting, measuring circuit and noise conditions; the phase position and separation of the clusters are comparatively more stable, which is why gap-time is used here as an additional quantitative indicator of PD development.</p>
    </section>

    <section id="help-workflow">
      <h4>Workflow Overview</h4>
      <table class="kv"><tbody>
        <tr><td class="k">1 · Case Input</td><td>Upload a PRPD image, or PRPD + TF map, or open a case from the Folder / Batch queue. One file runs the PRPD-only model; two files auto-switch to Hybrid.</td></tr>
        <tr><td class="k">2 · Classification Result</td><td>Read-only confidence scores, the PRPD plot, and the decision criteria used to reach the final result.</td></tr>
        <tr><td class="k">3 · PD Source</td><td>A rule-based PD source suggestion from the confidence scores. The reviewer confirms or overrides it.</td></tr>
        <tr><td class="k">4 · Plot Calibration</td><td>Align the frame lines to the plot's phase (0-360°) and amplitude axes.</td></tr>
        <tr><td class="k">5 · Gap-Time Detection</td><td>Mark the boundary between discharge clusters to measure gap angle, gap time and severity.</td></tr>
        <tr><td class="k">6 · Case Summary</td><td>A combined chart and full data table covering every step.</td></tr>
        <tr><td class="k">7 · Reviewer &amp; Sign-off</td><td>The signed-in account is the reviewer of record. Set the status and save.</td></tr>
      </tbody></table>
      <p>Steps 3 and 5 are deliberately <b>user-confirmed</b>. Automatic gap-time lines can be misplaced when cluster boundaries are unclear, so the confirmation step is what prevents an unreliable severity value from being recorded.</p>
    </section>

    <section id="help-classification">
      <h4>Understanding the Classification Result</h4>
      <p>Every case is scored under one fixed rule: <b>TopClass ${topclass}%</b>, matching the CMD FINAL V2 run that produced the imported dataset and the method reported in the paper. The rule is not selectable per case, so results stay comparable across the whole dataset.</p>
      <table class="data">
        <thead><tr><th>Criterion</th><th>Threshold</th><th>Rule</th></tr></thead>
        <tbody>
          <tr><td><b>TopClass</b>, the applied rule</td><td>&gt; ${topclass}%</td><td>All three classes ≤ ${topclass}% → "Non-identified"; otherwise the top class wins.</td></tr>
          <tr><td>Internal sanity check</td><td>${confidence}-${internalHigh}%</td><td>When Internal confidence falls in this band, the quadrant point-mass ratio must reach 0.15 on every side, or the result is overridden to "Non-identified".</td></tr>
        </tbody>
      </table>
      <h5>Model &amp; dataset provenance</h5>
      <p>Both models were trained on <b>994 laboratory cases</b> measured on basic PD test objects under IEC 60270 (320 corona, 346 surface and 328 internal), split <b>64% training / 20% testing / 16% validation</b>. The output layer uses a sigmoid activation, so the three confidence scores are independent and are not required to sum to 100%.</p>
      <table class="data">
        <thead><tr><th>Model</th><th>Input</th><th>Accuracy</th><th>Macro P / R / F1</th></tr></thead>
        <tbody>
          <tr><td>PRPD-only</td><td>One PRPD image</td><td>96.15%</td><td>96.75% / 95.83% / 96.07%</td></tr>
          <tr><td>Hybrid PRPD + TF Map</td><td>Paired PRPD and TF Map</td><td>96.15%</td><td>96.75% / 95.83% / 96.07%</td></tr>
        </tbody>
      </table>
      <p class="t12 muted" style="margin-top:10px;">Measured on 104 test samples. The two models scored identically on this test set. They differ in the input conditions they can be applied to, not in demonstrated accuracy.</p>
    </section>

    <section id="help-severity">
      <h4>Understanding Gap-Time &amp; Severity</h4>
      <p>Gap angle (°) becomes gap time (ms) assuming one 50 Hz mains cycle = ${cycle} ms: <code>gap_time_ms = |gap_angle_deg| × ${cycle} ms ÷ 360°</code>. The band and the confirmed PD source group then determine severity.</p>
      <table class="data">
        <thead><tr><th>PD source group</th><th>Gap time</th><th>Gap angle</th><th>Severity</th></tr></thead>
        <tbody>
          <tr><td rowspan="3">Group 1: Corona / Surface</td><td>&gt; ${moderateMs} ms</td><td>&gt; ${deg(moderateMs)}°</td><td><span class="pill pill-green">Initial</span></td></tr>
          <tr><td>${highMs} - ${moderateMs} ms</td><td>${deg(highMs)}° - ${deg(moderateMs)}°</td><td><span class="pill pill-amber">Moderate</span></td></tr>
          <tr><td>&lt; ${highMs} ms</td><td>&lt; ${deg(highMs)}°</td><td><span class="pill pill-red">High</span></td></tr>
          <tr><td rowspan="3">Group 2: Joint / Internal</td><td>&gt; ${moderateMs} ms</td><td>&gt; ${deg(moderateMs)}°</td><td><span class="pill pill-amber">Moderate</span></td></tr>
          <tr><td>${highMs} - ${moderateMs} ms</td><td>${deg(highMs)}° - ${deg(moderateMs)}°</td><td><span class="pill pill-red">High</span></td></tr>
          <tr><td>&lt; ${highMs} ms</td><td>&lt; ${deg(highMs)}°</td><td><span class="pill pill-red">High</span></td></tr>
        </tbody>
      </table>
      <p>If only one discharge cluster is present, gap-time cannot be measured. The system recommends marking the case <b>Not Measurable</b> with reason <code>single_discharge_cluster</code>.</p>
      <div class="callout callout-amber" style="margin-top:12px;"><b>Initial / Moderate / High are the criteria of this framework, not an international standard.</b> They come from the gap-time severity table developed in this project and apply to the conditions it was validated under. A gap time below ${highMs} ms does <b>not</b> on its own prove that a defect is severe, and a gap time above ${moderateMs} ms does not prove that it is safe. Read the band together with the confirmed PD source, the measurement conditions, and the history of the asset.</div>
    </section>

    <section id="help-limits">
      <h4>Scope &amp; Limitations</h4>
      <h5>1 · Input images</h5>
      <ul class="help-bullets">
        <li>The image must be a <b>PRPD pattern</b> suitable for analysis, one showing discharge clusters at interpretable phase positions, not a different kind of graph or signal plot.</li>
        <li>The PRPD should contain discharge activity on <b>both the positive and the negative polarity</b>, since gap-time analysis relies on two clusters of opposite polarity.</li>
        <li>Image quality must be sufficient. Low resolution, cropped edges, overlaid text or symbols, and heavy noise all reduce classification quality.</li>
        <li>Training images and application images should look alike. Plots from a different instrument, or with a markedly different PRPD style from the training data, can degrade the result.</li>
      </ul>
      <h5>2 · PD types covered</h5>
      <ul class="help-bullets">
        <li>The models are trained on <b>three classes only</b>: Corona, Surface and Internal discharge. They are not trained for every PD type that exists.</li>
        <li><b>Mixed PD or multiple simultaneous PD sources may be classified incorrectly</b>, as the training database consists of single-type (pure) PD cases.</li>
      </ul>
      <h5>3 · PRPD and TF Map pairing</h5>
      <ul class="help-bullets">
        <li>The Hybrid model uses the PRPD together with the TF Map to add information to the classification. It is not claimed to be the most accurate option in all cases. On the reported test set both models scored identically.</li>
        <li>The Hybrid model is appropriate when the PRPD and TF Map are a <b>paired input from the same measurement</b>.</li>
        <li>If the PRPD and the TF Map do not come from the same case, they must <b>not</b> be paired for training or inference.</li>
        <li>For mixed PD, the Hybrid model may add useful information when the PRPD pattern is complex, but it does not guarantee correct classification of mixed PD.</li>
      </ul>
      <h5>4 · Training</h5>
      <ul class="help-checklist">
        <li>Data must be arranged in the directory structure the system defines.</li>
        <li>Data must be separated correctly by class.</li>
        <li>Image labels must be verified before training starts.</li>
        <li>The system uses a fixed split of <b>64% training / 20% testing / 16% validation</b>.</li>
        <li>Each class should hold enough samples, and class counts should not be far out of balance with one another.</li>
        <li>The same image, or images derived from the same measurement, must never appear in both the training and the testing set. That is <b>data leakage</b>, and it inflates the evaluation scores.</li>
      </ul>
      <h5>5 · AI results</h5>
      <ul class="help-bullets">
        <li>The AI result is a <b>preliminary assessment, not a diagnosis</b>.</li>
        <li>Results vary with the quality and the characteristics of the input data.</li>
        <li>A confidence value does <b>not</b> mean the system can confirm that the PD type is correct with 100% certainty.</li>
        <li>If no class exceeds the configured threshold, the result is reported as <b>Non-identified</b> rather than guessed.</li>
        <li>The user must review the result together with the measurement data and a qualified expert before using it in any engineering decision.</li>
      </ul>
      <h5>6 · Gap-time and severity</h5>
      <ul class="help-bullets">
        <li>Gap-time is an indicator for <b>preliminary severity assessment</b>.</li>
        <li>The system must be able to identify two discharge clusters of opposite polarity before a gap-time can be calculated.</li>
        <li>If only one cluster is present, or the cluster boundaries cannot be clearly defined, gap-time cannot be computed.</li>
        <li>Such cases are reported as <b>Not measurable</b>, not as a low or high severity.</li>
        <li>Initial / Moderate / High are the assessment bands of this framework and should not be read as an international standard for all PD systems.</li>
      </ul>
    </section>

    <section id="help-data">
      <h4>Data Handling &amp; Privacy</h4>
      <p>Consent is collected in a separate dialog when you enter the system, and it is recorded as two independent choices. Accepting the terms of use is required in order to use the system; allowing your uploads to be used for dataset and model development is optional and can be declined without affecting any analysis feature.</p>
      <p>If you give the optional consent, the data retained is:</p>
      <table class="kv"><tbody>
        <tr><td class="k">PRPD image</td><td>The uploaded phase-resolved plot.</td></tr>
        <tr><td class="k">TF Map</td><td>The paired time-frequency map, when one is uploaded.</td></tr>
        <tr><td class="k">Class label</td><td>The PD source you confirm during review.</td></tr>
        <tr><td class="k">Model result</td><td>Confidence scores, final result, gap-time and severity.</td></tr>
        <tr><td class="k">Related metadata</td><td>Case name, timestamps, calibration values and reviewer account.</td></tr>
      </tbody></table>
      <p>No personal data beyond the reviewer account needed to attribute a sign-off is collected. Do not upload images that contain personal or commercially confidential information in the plot itself.</p>
    </section>

    <section id="help-refs">
      <h4>References</h4>
      <ol class="help-refs">
        <li><i>High-voltage Test Techniques: Partial Discharge Measurements</i>, IEC 60270, Dec. 2000.</li>

/* =========================================================================
   DERIVED DATA  (api/v1/batches.py)
   ========================================================================= */
function casesOfBatch(batchId) {
  return state.cases.filter((c) => c.batch_id === batchId);
}

function batchSummary(b) {
  const cs = casesOfBatch(b.id);
  const done = cs.filter((c) => c.status === 'done').length;
  const inReview = cs.filter((c) => c.status === 'in_review').length;
  const high = cs.filter((c) => severityBucket(c.severity_by_gap_time) === 'High').length;
  const overall = cs.length && done === cs.length ? 'done' : inReview || done ? 'in_review' : 'pending';
  return {
    ...b,
    total: cs.length,
    done,
    high_severity: high,
    overall_status: overall,
    first_case_id: cs.length ? cs[0].id : null,
    cases: cs,
  };
}

function uploadHistory() {
  const rows = state.batches.map(batchSummary).filter((b) => b.total > 0);
  rows.sort((a, b) => (b.upload_date || '').localeCompare(a.upload_date || ''));
  rows.sort((a, b) => {
    const closed = (s) => (s.done >= s.total && s.total > 0 ? 1 : 0);
    return closed(a) - closed(b) || b.high_severity - a.high_severity;
  });
  return rows;
}

function dashboardData() {
  const cases = state.cases;
  const total = cases.length;
  const countResult = (label) => cases.filter((c) => c.ai_final_result === label).length;
  const pct = (v) => (total ? Math.round((v / total) * 100) : 0);
  const corona = countResult('Corona');
  const surface = countResult('Surface');
  const internal = countResult('Internal');

  const singleBatchIds = new Set(state.batches.filter((b) => b.is_single).map((b) => b.id));
  const singleCases = cases.filter((c) => singleBatchIds.has(c.batch_id));

  return {
    kpi: {
      total,
      corona,
      corona_pct: pct(corona),
      surface,
      surface_pct: pct(surface),
      internal,
      internal_pct: pct(internal),
    },
    severity_groups: groupCasesBySeverity(singleCases),
    upload_history: uploadHistory(),
    reviewed_count: cases.filter((c) => c.status === 'done').length,
  };
}

/* =========================================================================
   SEVERITY GROUP CARDS  (components/case/SeverityGroups.tsx)
   ========================================================================= */
const SEVERITY_ORDER = ['High', 'Moderate', 'Initial', 'Pending'];
const SEVERITY_LABEL = {
  High: 'High severity',
  Moderate: 'Moderate severity',
  Initial: 'Initial severity',
  Pending: 'Awaiting gap-time measurement',
};
const SEVERITY_ACCENT = {
  High: 'var(--internal)',
  Moderate: 'var(--corona)',
  Initial: 'var(--emerald-500)',
  Pending: 'var(--slate-400)',
};
const SEVERITY_PILL = { High: 'pill-red', Moderate: 'pill-amber', Initial: 'pill-green', Pending: 'pill-gray' };

function groupCasesBySeverity(cases) {
  return SEVERITY_ORDER.map((key) => {
    const members = cases.filter((c) => severityBucket(c.severity_by_gap_time) === key);
    return { key, label: SEVERITY_LABEL[key], count: members.length, cases: members };
  });
}

function severityGroupCards(groups, openAct, emptyLabel, deletable) {
  return groups
    .map(
      (g) => `
    <div class="card severity-card" style="border-left:4px solid ${SEVERITY_ACCENT[g.key]};">
      <div class="severity-card-head">
        <span class="label">${g.label}</span>
        <span class="pill ${SEVERITY_PILL[g.key]}">${g.count} case${g.count === 1 ? '' : 's'}</span>
      </div>
      ${
        g.cases.length === 0
          ? `<p class="hint" style="padding:10px 20px 16px; margin:0;">${esc(emptyLabel)}</p>`
          : `<div class="scroll-y-420"><table class="data" style="margin-top:6px;">
              <thead><tr><th>Case ID</th><th>Defect</th><th>PD Source</th><th>Status</th><th>Reviewer</th><th></th></tr></thead>
              <tbody>${g.cases
                .map(
                  (c) => `<tr>
                  <td><b>${esc(c.case_base_name)}</b></td>
                  <td class="t125 muted-2">${esc(c.defect_name || '-')}</td>
                  <td class="t125">${esc(c.confirmed_pd_source_type || '-')}</td>
                  <td>${statusBadge(c.status)}</td>
                  <td class="t125 muted-2">${esc(c.reviewer_name || '-')}</td>
                  <td class="nowrap">
                    <span class="small-link" data-act="${openAct}" data-id="${c.id}">Open case →</span>
                    ${deletable ? `<span class="small-link danger" style="margin-left:10px;" data-act="delete-case" data-id="${c.id}">Delete</span>` : ''}
                  </td>
                </tr>`,
                )
                .join('')}</tbody>
            </table></div>`
      }
    </div>`,
    )
    .join('');
}

function filterBar(dateFilter, severityFilter) {
  const active = dateFilter !== 'all' || severityFilter !== 'all';
  const opt = (v, label, cur) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${label}</option>`;
  return `
  <div class="topfilters">
    <label>Uploaded:
      <select data-act="filter-date">
        ${opt('all', 'All time', dateFilter)}${opt('today', 'Today', dateFilter)}${opt('3d', 'Last 3 days', dateFilter)}${opt('7d', 'Last 7 days', dateFilter)}
      </select>
    </label>
    <label>Severity:
      <select data-act="filter-severity">
        ${opt('all', 'All severities', severityFilter)}${opt('High', 'High', severityFilter)}${opt('Moderate', 'Moderate', severityFilter)}${opt('Initial', 'Initial', severityFilter)}${opt('Pending', 'Pending', severityFilter)}
      </select>
    </label>
    ${active ? '<span class="small-link" data-act="filter-clear">Clear filters</span>' : ''}

}

/* =========================================================================
   PRPD BITMAPS
   Cases imported from the dataset are drawn from their stored geometry
   (frame, cluster ranges, gap lines); a case uploaded here in the browser
   keeps the reviewer's own file. Either way the rest of the workflow reads
   the bitmap exactly as it reads one served by /api/v1/files.
   ========================================================================= */
const imageCache = {};

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i += 1) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/** A PRPD plot for a dataset case, matching the geometry stored on the case. */
function synthPrpd(c) {
  const w = c.image_width || 388;
  const h = c.image_height || 281;
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = h;
  const x = cv.getContext('2d');
  const cal = c.calibration;
  const fx1 = cal.x_left_0deg ?? 73;
  const fx2 = cal.x_right_360deg ?? w - 40;
  const fy1 = cal.y_top_plot ?? 16;
  const fy2 = cal.y_bottom_plot ?? h - 48;
  const midY = (fy1 + fy2) / 2;
  const halfH = (fy2 - fy1) / 2;
  const span = fx2 - fx1;
  const rnd = mulberry32(hashString(c.case_base_name || String(c.id)));

  x.fillStyle = '#ffffff';
  x.fillRect(0, 0, w, h);

  // ---- axis labels / title, in the style of the exported dataset plots ----
  x.fillStyle = '#000000';
  x.font = 'bold 8.5px "Segoe UI", Arial, sans-serif';
  x.fillText('PRPD pattern', fx1 + 2, fy1 - 5);
  x.font = '7px "Segoe UI", Arial, sans-serif';
  x.textAlign = 'center';
  [0, 90, 180, 270, 360].forEach((p) => {
    const px = fx1 + (p / 360) * span;
    x.beginPath();
    x.moveTo(px, fy2);
    x.lineTo(px, fy2 + 3);
    x.strokeStyle = '#000';
    x.lineWidth = 0.8;
    x.stroke();
    x.fillText(String(p), px, fy2 + 12);
  });
  x.fillText('Phase [deg]', (fx1 + fx2) / 2, h - 4);
  x.textAlign = 'right';
  for (let k = -3; k <= 3; k += 1) {
    const py = midY - (k / 3) * halfH * 0.92;
    x.beginPath();
    x.moveTo(fx1 - 3, py);
    x.lineTo(fx1, py);
    x.stroke();
    x.fillText(`${k < 0 ? '-' : ''}${Math.abs(k).toFixed(2)}E+0`, fx1 - 5, py + 2.5);
  }
  x.textAlign = 'left';
  x.save();
  x.translate(9, midY);
  x.rotate(-Math.PI / 2);
  x.textAlign = 'center';
  x.fillText('Amplitude [ V ]', 0, 0);
  x.restore();
  x.textAlign = 'left';

  // ---- the AC reference sine and the zero line, drawn as dot trails ----
  x.fillStyle = '#111111';
  for (let p = 0; p <= 360; p += 0.6) {
    const px = fx1 + (p / 360) * span;
    const py = midY - Math.sin((p * Math.PI) / 180) * halfH * 0.9;
    x.fillRect(px, py, 0.8, 0.8);
  }
  for (let px = fx1; px <= fx2; px += 2) x.fillRect(px, midY, 1, 0.8);

  // ---- discharge clusters ----
  const cls = c.ai_top_class || (c._analysis && c._analysis.ai_top_class) || 'Surface';
  const gap = c.gap && c.gap.left_line_pixel != null ? c.gap : (c._analysis || {}).gap || {};
  const detected = gap.detected_case || (c._analysis && c._analysis.gap && c._analysis.gap.detected_case) || '';
  const singleOnly = /single_discharge_cluster|no_clear/.test(detected);

  // Cluster width and amplitude spread follow the class characteristics the
  // Help page describes: corona narrow and uniform, surface wide, internal
  // symmetric between the half-cycles.
  const profile = {
    Corona: { width: 26, points: 900, spread: 0.3, base: 0.34 },
    Surface: { width: 52, points: 1150, spread: 0.72, base: 0.2 },
    Internal: { width: 40, points: 1000, spread: 0.5, base: 0.26 },
  }[cls] || { width: 40, points: 1000, spread: 0.5, base: 0.26 };

  let leftPx = gap.left_line_pixel;
  let rightPx = gap.right_line_pixel;
  if (leftPx == null || rightPx == null) {
    leftPx = fx1 + 0.3 * span;
    rightPx = fx1 + 0.66 * span;
  }

  function scatter(x0, x1, sign, points, spread, base) {
    for (let i = 0; i < points; i += 1) {
      const t = rnd();
      // Denser in the middle of the cluster, thinning towards both edges.
      const u = (t + rnd() + rnd()) / 3;
      const px = x0 + u * (x1 - x0);
      const amp = base + Math.abs(rnd() + rnd() - 1) * spread;
      const py = midY - sign * amp * halfH * (0.35 + 0.65 * rnd());
      if (py < fy1 + 2 || py > fy2 - 2) continue;
      x.globalAlpha = 0.45 + rnd() * 0.55;
      x.fillRect(px, py, 0.9, 0.9);
    }
    x.globalAlpha = 1;
  }

  const negFirst = !/positive_left/.test(detected);
  if (singleOnly) {
    scatter(rightPx - profile.width / 2, rightPx + profile.width / 2, 1, profile.points, profile.spread, profile.base);
  } else {
    scatter(leftPx - profile.width, leftPx, negFirst ? -1 : 1, profile.points, profile.spread, profile.base);
    scatter(rightPx, rightPx + profile.width, negFirst ? 1 : -1, profile.points, profile.spread, profile.base);
  }

  // ---- plot frame, drawn last so it stays crisp ----
  x.strokeStyle = '#000000';
  x.lineWidth = 1;
  x.strokeRect(fx1 + 0.5, fy1 + 0.5, span - 1, fy2 - fy1 - 1);
  return cv;
}

/** Resolves the bitmap for a case, then calls back. */
function ensureImage(c, cb) {
  const hit = imageCache[c.id];
  if (hit && hit.ready) {
    cb(hit.el);
    return;
  }
  if (c._dataUrl) {
    const entry = { el: null, ready: false };
    imageCache[c.id] = entry;
    const img = new Image();
    img.onload = () => {
      entry.el = img;
      entry.ready = true;
      cb(img);
    };
    img.onerror = () => {
      entry.el = synthPrpd(c);
      entry.ready = true;
      cb(entry.el);
    };
    img.src = c._dataUrl;
    return;
  }
  const el = synthPrpd(c);
  imageCache[c.id] = { el, ready: true };
  cb(el);
}

/* =========================================================================
   PIXEL ANALYSIS  (services/cv: auto-calibration and rule-based gap lines)
   ========================================================================= */
function imagePixels(el, w, h) {
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(el, 0, 0, w, h);
  return ctx.getImageData(0, 0, w, h);
}

/** Locates the drawn plot frame by projecting the darkest rows and columns. */
function autoDetectFrame(c, el) {
  const w = c.image_width || 388;
  const h = c.image_height || 281;
  const px = imagePixels(el, w, h).data;
  const colDark = new Array(w).fill(0);
  const rowDark = new Array(h).fill(0);
  for (let y = 0; y < h; y += 1) {
    for (let x = 0; x < w; x += 1) {
      const i = (y * w + x) * 4;
      if (px[i] + px[i + 1] + px[i + 2] < 330) {
        colDark[x] += 1;
        rowDark[y] += 1;
      }
    }
  }
  const bestIn = (arr, from, to, minRatio, len) => {
    let best = -1;
    let bestVal = minRatio * len;
    for (let i = from; i < to; i += 1) {
      if (arr[i] > bestVal) {
        bestVal = arr[i];
        best = i;
      }
    }
    return best;
  };
  const xLeft = bestIn(colDark, 2, Math.floor(w * 0.45), 0.5, h);
  const xRight = bestIn(colDark, Math.floor(w * 0.55), w - 2, 0.5, h);
  const yTop = bestIn(rowDark, 2, Math.floor(h * 0.4), 0.5, w);
  const yBottom = bestIn(rowDark, Math.floor(h * 0.6), h - 2, 0.5, w);
  if (xLeft < 0 || xRight < 0 || yTop < 0 || yBottom < 0 || xRight <= xLeft || yBottom <= yTop) {
    return { frame: null, status: 'projection_fallback' };
  }
  return {
    frame: { x_left: xLeft, x_right: xRight, y_top: yTop, y_bottom: yBottom },
    status: 'auto_contour_detected',
  };
}

/**
 * Rule-based cluster boundaries: dark-pixel mass per column, split by
 * polarity around the mid-line, largest run on each half-cycle.
 */
function detectClusters(c, el, frame) {
  const w = c.image_width || 388;
  const h = c.image_height || 281;
  const px = imagePixels(el, w, h).data;
  const x1 = Math.max(0, Math.round(frame.x_left) + 2);
  const x2 = Math.min(w - 1, Math.round(frame.x_right) - 2);
  const y1 = Math.max(0, Math.round(frame.y_top) + 2);
  const y2 = Math.min(h - 1, Math.round(frame.y_bottom) - 2);
  const mid = (y1 + y2) / 2;
  const guard = (y2 - y1) * 0.06; // ignore the zero line and the sine crossing

  const pos = new Array(w).fill(0);
  const neg = new Array(w).fill(0);
  for (let y = y1; y <= y2; y += 1) {
    if (Math.abs(y - mid) < guard) continue;
    for (let x = x1; x <= x2; x += 1) {
      const i = (y * w + x) * 4;
      if (px[i] + px[i + 1] + px[i + 2] < 380) {
        if (y < mid) pos[x] += 1;
        else neg[x] += 1;
      }
    }
  }
  // The reference sine contributes ~1 dark pixel per column; a real cluster is
  // an order of magnitude denser, so the threshold scales with the peak.
  const runFor = (arr) => {
    const peak = Math.max(...arr);
    if (peak < 6) return null;
    const cut = Math.max(3, peak * 0.22);
    let best = null;
    let start = -1;
    for (let x = x1; x <= x2 + 1; x += 1) {
      const on = x <= x2 && arr[x] >= cut;
      if (on && start < 0) start = x;
      if (!on && start >= 0) {
        const run = { start, end: x - 1, mass: 0 };
        for (let k = run.start; k <= run.end; k += 1) run.mass += arr[k];
        if (run.end - run.start >= 4 && (!best || run.mass > best.mass)) best = run;
        start = -1;
      }
    }
    return best;
  };

  const posRun = runFor(pos);
  const negRun = runFor(neg);
  if (!posRun && !negRun) {
    return { single: true, status: 'no_clear_discharge_cluster_detected', reason: 'no clear positive/negative discharge cluster pair was detected' };
  }
  if (!posRun || !negRun) {
    const half = posRun ? 'positive' : 'negative';
    return {
      single: true,
      status: `single_discharge_cluster_detected_${half}_only`,
      reason: `single discharge cluster detected on the ${half} half-cycle only`,
    };
  }
  const negLeft = negRun.start <= posRun.start;
  const first = negLeft ? negRun : posRun;
  const second = negLeft ? posRun : negRun;
  return {
    single: false,
    left: first.end,
    right: second.start,
    status: negLeft ? 'negative_left_positive_right' : 'positive_left_negative_right',
    positive_x_range_pixel: `(${posRun.start}, ${posRun.end})`,
    negative_x_range_pixel: `(${negRun.start}, ${negRun.end})`,
  };
}

/* =========================================================================
   GAP METRICS  (rules.compute_gap_metrics / validate_gap_time_result)
   ========================================================================= */
function computeGapMetrics(c, leftPx, rightPx) {
  const cal = c.calibration;
  const xl = cal.x_left_0deg ?? 0;
  const xr = cal.x_right_360deg ?? 1;
  const span = xr - xl || 1;
  const leftDeg = ((leftPx - xl) / span) * 360;
  const rightDeg = ((rightPx - xl) / span) * 360;
  const angle = Math.abs(rightDeg - leftDeg);
  const ms = (angle * T().cycle_time_ms) / 360;
  return {
    left_line_pixel: round2(leftPx),
    right_line_pixel: round2(rightPx),
    left_phase_deg: round2(leftDeg),
    right_phase_deg: round2(rightDeg),
    gap_angle_deg: round2(angle),
    gap_time_ms: Math.round(ms * 10000) / 10000,
    gap_time_band: gapTimeBand(ms),
  };
}

function validateGapTimeResult(c) {
  const g = c.gap;
  const cal = c.calibration;
  if (g.auto_not_measurable_recommended)
    return [false, 'Gap-time is not measurable because only one discharge cluster was detected. Please use the Not Measurable button.'];
  const messages = [];
  if ((cal.x_right_360deg ?? 0) <= (cal.x_left_0deg ?? 0)) messages.push('x_right_360deg must be greater than x_left_0deg.');
  if ((cal.y_bottom_plot ?? 0) <= (cal.y_top_plot ?? 0)) messages.push('y_bottom must be greater than y_top.');
  if (g.left_line_pixel == null || g.right_line_pixel == null) messages.push('Gap lines have not been placed yet.');
  else {
    if (g.left_line_pixel >= g.right_line_pixel) messages.push('left_line must be less than right_line.');
    if (!(cal.x_left_0deg <= g.left_line_pixel && g.left_line_pixel <= cal.x_right_360deg)) messages.push('left_line is outside plot frame.');
    if (!(cal.x_left_0deg <= g.right_line_pixel && g.right_line_pixel <= cal.x_right_360deg)) messages.push('right_line is outside plot frame.');
  }
  if (g.gap_angle_deg == null || g.gap_angle_deg <= 0) messages.push('gap_angle must be positive.');
  if (g.gap_time_ms == null || g.gap_time_ms <= 0 || g.gap_time_ms > T().cycle_time_ms)
    messages.push(`gap_time_ms must be within 0-${T().cycle_time_ms.toFixed(0)} ms.`);
  return messages.length ? [false, messages.join(' | ')] : [true, 'OK'];
}

/** Re-applies the severity rules after a gap or PD source change. */
function applyGap(c, metrics, extra) {
  c.gap = { ...c.gap, ...metrics, ...(extra || {}) };
  c.severity_by_gap_time = severityFrom(c.gap.gap_time_ms, c.confirmed_pd_source_type);
  c.severity_group = severityGroupLabel(c.confirmed_pd_source_type);
  c.updated_time = new Date().toISOString();
}

function describeModel(modelUsed, inputMode) {
  const hybrid = (inputMode || '').toUpperCase().includes('HYBRID');
  const base = hybrid
    ? 'Hybrid model, using PRPD paired with TF Map'
    : 'PRPD-only model, using a single PRPD image';
  return /mock/i.test(modelUsed || '') ? `${base} (mock engine, not a real prediction)` : base;
}

function currentCase() {
  return state.cases.find((c) => c.id === state.route.id);
}

function siblingsOf(c) {
  return c.batch_id != null ? casesOfBatch(c.batch_id) : state.cases;
}

function matchingPreset(c) {
  const rows = state.presets.filter((p) => p.image_width === c.image_width && p.image_height === c.image_height);
  rows.sort((a, b) => (b.saved_time || '').localeCompare(a.saved_time || ''));
  return rows[0] || null;
}

function viewCase() {
  const c = currentCase();
  if (!c) return '<p class="hint">Case not found.</p>';
  if (state.ui.loading) return spinner('Loading case…');

  const u = state.ui;

  const gap = c.gap;
  const frame = u.frame;

  const siblings = siblingsOf(c);

  const nextCase = queueIndex >= 0 && queueIndex < queueTotal - 1 ? siblings[queueIndex + 1] : null;
  let nextPending = null;
  for (let i = 1; i <= queueTotal; i += 1) {

  const decisionModeDescription = decisionMode ? decisionMode.description : '';

            ${readout('Gap time / band', `${fmt(gap.gap_time_ms, 4)} ms (${esc(gap.gap_time_band || '-')})`, 'sm')}
            ${readout('Severity', esc(c.severity_by_gap_time || '-'))}
            ${readout('Review status', esc(c.review_status), 'sm')}
            ${readout('Reviewer', esc(c.reviewer_name || '-'), 'sm')}
          </div>
          <div class="scroll-table-wrap mt-4">${fullSummaryTable(c)}</div>
        </div>
      </div>
    </div>`;
  }

  /* ---------------- STEP 5: SIGN-OFF ---------------- */
  if (u.step === 'signoff') {
    body = `
    <div class="card">
      <h2>Reviewer &amp; Sign-off</h2>
      <p class="hint">Signed in as the reviewer of record below. Complete the review status and save once Classification, PD Source, Calibration, Gap-Time and Summary have been checked.</p>
      <div class="row">
        <div class="col">
          <div class="field">
            <label class="field-label">Reviewer</label>
            <div class="locked-banner mb-0"><b>${esc(state.user.username)}</b> <span class="capitalize muted-2">(${esc(state.user.role)})</span></div>
          </div>
          <div class="field">
            <label class="field-label">Review status</label>
            <select data-act="review-status">
              <option value="user_confirmed" ${u.reviewStatus === 'user_confirmed' ? 'selected' : ''}>Confirmed as-is</option>
              <option value="expert_corrected" ${u.reviewStatus === 'expert_corrected' ? 'selected' : ''}>Corrected by expert</option>
              <option value="not_measurable" ${u.reviewStatus === 'not_measurable' ? 'selected' : ''}>Not measurable</option>
            </select>
          </div>
          ${
            u.reviewStatus === 'not_measurable'
              ? `<div class="field">
                  <label class="field-label">Reason not measurable</label>
                  <select data-act="nm-reason">
                    ${o.not_measurable_reasons
                      .map((r) => `<option value="${r}" ${u.notMeasurableReason === r ? 'selected' : ''}>${r.replace(/_/g, ' ')}</option>`)
                      .join('')}
                  </select>
                </div>`
              : ''
          }
        </div>
        <div class="col">
          <div class="field">
            <label class="field-label">Review note</label>
            <textarea data-act="review-note" placeholder="Additional notes (optional)" style="min-height:110px;">${esc(u.reviewNote || '')}</textarea>
          </div>
        </div>
      </div>
      ${
        singleCluster && u.reviewStatus !== 'not_measurable'
          ? '<div class="locked-banner amber">The detector found only one discharge cluster, so gap-time cannot be measured. Saving with a measurable status will be rejected. Use <b>Not Measurable</b>.</div>'
          : ''
      }
      <div class="flex flex-wrap gap-10">
        <button class="btn btn-green" type="button" data-act="accept-save" ${u.saving ? 'disabled' : ''}>${ICON.check(15)}Accept and Save</button>
        <button class="btn btn-red" type="button" data-act="not-measurable" ${u.saving ? 'disabled' : ''}>${ICON.x(15)}Not Measurable</button>
        ${
          queueTotal > 1
            ? `<button class="btn btn-blue ml-auto" type="button" data-act="save-advance" ${u.saving || advanceBlocked ? 'disabled' : ''} title="${
                advanceBlocked
                  ? 'Gap-time is not measurable for this case. Use Not Measurable first'
                  : nextPending
                    ? `${alreadySaved ? 'Open' : 'Save, then open'} ${esc(nextPending.case_base_name)}`
                    : 'Finish here and return to the queue'
              }">${alreadySaved ? '' : 'Save and '}${nextPending ? 'Next Case →' : 'Finish Queue →'}</button>`
            : ''
        }
      </div>
      ${
        queueTotal > 1
          ? `<p class="hint mb-0" style="margin-top:10px;">${
              advanceBlocked
                ? 'Mark this case <b>Not Measurable</b> to sign it off, then continue to the next one.'
                : nextPending
                  ? `${queueTotal - queueDone} case${queueTotal - queueDone === 1 ? '' : 's'} left to review in this queue · next up <b>${esc(
                      nextPending.case_base_name,
                    )}</b>`
                  : 'Every other case in this queue is reviewed.'
            }</p>`
          : ''
      }
    </div>`;
  }

  const footer = `
  <div class="wizard-footer">
    <button class="btn btn-outline" type="button" data-act="wizard-back" style="visibility:${stepIndex === 0 ? 'hidden' : 'visible'};">← Back</button>
    <button class="btn btn-blue" type="button" data-act="wizard-next" style="visibility:${stepIndex === STEPS.length - 1 ? 'hidden' : 'visible'};">Next →</button>
  </div>`;

  return navBar + wizardNav + body + footer;
}

/** Full PD-source-group × gap-time-band matrix, so severity is explainable. */
function severityMatrixHTML(c) {
  const t = T();
  const source = c.confirmed_pd_source_type || '';
  const high = t.gap_time_high_ms;
  const mod = t.gap_time_moderate_ms;
  const cycle = t.cycle_time_ms;
  const deg = (ms) => Math.round((ms * 360) / cycle);
  let rows = [];
  if (SEVERITY_GROUP_1.includes(source))
    rows = [
      [`> ${mod} ms`, `> ${deg(mod)}°`, 'Initial'],
      [`${high}-${mod} ms`, `${deg(high)}° - ${deg(mod)}°`, 'Moderate'],
      [`< ${high} ms`, `< ${deg(high)}°`, 'High'],
    ];
  else if (SEVERITY_GROUP_2.includes(source))
    rows = [
      [`> ${mod} ms`, `> ${deg(mod)}°`, 'Moderate'],
      [`${high}-${mod} ms`, `${deg(high)}° - ${deg(mod)}°`, 'High'],
      [`< ${high} ms`, `< ${deg(high)}°`, 'High'],
    ];

  return `
  <div class="readout-grid mt-0">
    ${readout('PD source group', esc(c.severity_group), 'sm')}
    ${readout('Measured gap time', fmt(c.gap.gap_time_ms, 4, ' ms'))}
    ${readout('Measured gap angle', fmt(c.gap.gap_angle_deg, 4, '°'))}
    ${readout('Resulting severity', `<span class="pill ${severityPillClass(c.severity_by_gap_time)}">${esc(c.severity_by_gap_time || '-')}</span>`)}
  </div>
  ${
    rows.length
      ? `<table class="data" style="margin-top:12px;">
          <thead><tr><th>Gap time</th><th>Gap angle</th><th>Severity</th></tr></thead>
          <tbody>${rows
            .map(
              ([band, d, sev]) =>
                `<tr style="${c.gap.gap_time_band === band ? 'background:var(--slate-50);' : ''}"><td>${band}</td><td>${d}</td><td><span class="pill ${severityPillClass(
                  sev,

            )
            .join('')}</tbody>
        </table>`
      : '<p class="hint" style="margin-top:10px;">Confirm a PD source above to see the applicable severity table.</p>'
  }`;
}

   CANVASES  (components/case/PrpdCanvas.tsx, SummaryChart.tsx)
