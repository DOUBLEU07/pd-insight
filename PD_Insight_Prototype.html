const HIT_TOLERANCE_PX = 9;
const DISPLAY_WIDTH = 720;

function drawPrpdCanvas(canvas, c, mode, img) {
  const u = state.ui;
  const imageWidth = c.image_width || 400;
  const imageHeight = c.image_height || 300;
  const scale = imageWidth > 0 ? DISPLAY_WIDTH / imageWidth : 1;
  canvas.width = DISPLAY_WIDTH;
  canvas.height = Math.round(imageHeight * scale);

  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  if (img) ctx.drawImage(img, 0, 0, w, h);
  else {
    ctx.fillStyle = '#94A3B8';
    ctx.font = '12px Kanit, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PRPD image unavailable', w / 2, h / 2);
    ctx.textAlign = 'left';
  }

  const f = u.frame;
  const fx1 = f.x_left * scale;
  const fx2 = f.x_right * scale;
  const fy1 = f.y_top * scale;
  const fy2 = f.y_bottom * scale;

  ctx.save();
  ctx.strokeStyle = 'rgba(100,116,139,.55)';
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 3]);
  [90, 180, 270].forEach((deg) => {
    const x = fx1 + (deg / 360) * (fx2 - fx1);
    ctx.beginPath();
    ctx.moveTo(x, fy1);
    ctx.lineTo(x, fy2);
    ctx.stroke();
  });
  ctx.restore();

  if (mode === 'calibration') {
    ctx.save();
    ctx.strokeStyle = '#F59E0B';
    ctx.lineWidth = 2;
    ctx.strokeRect(fx1, fy1, fx2 - fx1, fy2 - fy1);
    ctx.restore();

    ctx.save();
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = '#1F4E79';
    [fx1, fx2].forEach((x) => {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    });
    ctx.strokeStyle = '#F59E0B';
    [fy1, fy2].forEach((y) => {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    });
    ctx.restore();

    ctx.font = 'bold 11px Kanit, sans-serif';
    ctx.fillStyle = '#1F4E79';
    ctx.fillText('x_left (0°)', fx1 + 4, 14);
    ctx.fillText('x_right (360°)', Math.max(4, fx2 - 86), 14);
    ctx.fillStyle = '#B45309';
    ctx.fillText('y_top', 4, Math.max(12, fy1 - 5));
    ctx.fillText('y_bottom', 4, Math.min(h - 4, fy2 + 14));
  } else {
    ctx.save();
    ctx.strokeStyle = '#CBD5E1';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(fx1, fy1, fx2 - fx1, fy2 - fy1);
    ctx.restore();

    const gl = u.gapLines;
    if (gl.left != null && gl.right != null) {
      const gx1 = gl.left * scale;
      const gx2 = gl.right * scale;
      ctx.save();
      ctx.fillStyle = 'rgba(245,158,11,0.14)';
      ctx.fillRect(Math.min(gx1, gx2), fy1, Math.abs(gx2 - gx1), fy2 - fy1);
      ctx.lineWidth = 2.6;
      ctx.strokeStyle = '#F59E0B';
      ctx.beginPath();
      ctx.moveTo(gx1, fy1);
      ctx.lineTo(gx1, fy2);
      ctx.stroke();
      ctx.strokeStyle = '#10B981';
      ctx.beginPath();
      ctx.moveTo(gx2, fy1);
      ctx.lineTo(gx2, fy2);
      ctx.stroke();
      ctx.restore();
      ctx.font = 'bold 11px Kanit, sans-serif';
      ctx.fillStyle = '#B45309';
      ctx.fillText('L', gx1 + 4, fy1 + 14);
      ctx.fillStyle = '#047857';
      ctx.fillText('R', gx2 + 4, fy1 + 14);
    }
  }
}

function attachCanvasDrag(canvas, c, mode, img) {
  const u = state.ui;
  const imageWidth = c.image_width || 400;
  const imageHeight = c.image_height || 300;
  const scale = DISPLAY_WIDTH / imageWidth;
  let dragging = null;

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      mx: (e.clientX - rect.left) * (canvas.width / rect.width),
      my: (e.clientY - rect.top) * (canvas.height / rect.height),
    };
  }
  function hitTest(mx, my) {
    const cand = [];
    if (mode === 'calibration') {
      cand.push(
        ['x_left', Math.abs(mx - u.frame.x_left * scale)],
        ['x_right', Math.abs(mx - u.frame.x_right * scale)],
        ['y_top', Math.abs(my - u.frame.y_top * scale)],
        ['y_bottom', Math.abs(my - u.frame.y_bottom * scale)],
      );
    } else if (u.gapLines.left != null && u.gapLines.right != null) {
      cand.push(['gapLeft', Math.abs(mx - u.gapLines.left * scale)], ['gapRight', Math.abs(mx - u.gapLines.right * scale)]);
    }
    const within = cand.filter(([, d]) => d < HIT_TOLERANCE_PX).sort((a, b) => a[1] - b[1]);
    return within.length ? within[0][0] : null;
  }
  function valueFor(handle, mx, my) {
    const vertical = handle === 'y_top' || handle === 'y_bottom';
    const raw = vertical ? my / scale : mx / scale;
    const limit = vertical ? imageHeight : imageWidth;
    return Math.round(Math.max(0, Math.min(limit, raw)));
  }

  canvas.onpointerdown = (e) => {
    const { mx, my } = pos(e);
    const hit = hitTest(mx, my);
    if (!hit) return;
    canvas.setPointerCapture(e.pointerId);
    dragging = hit;
  };
  canvas.onpointermove = (e) => {
    const { mx, my } = pos(e);
    if (!dragging) {
      const hover = hitTest(mx, my);
      canvas.style.cursor = hover ? (hover === 'y_top' || hover === 'y_bottom' ? 'ns-resize' : 'ew-resize') : 'default';
      return;
    }
    const value = valueFor(dragging, mx, my);
    if (mode === 'calibration') u.frame[dragging] = value;
    else if (dragging === 'gapLeft') u.gapLines.left = value;
    else u.gapLines.right = value;
    drawPrpdCanvas(canvas, c, mode, img);
  };
  canvas.onpointerup = () => {
    if (!dragging) return;
    const handle = dragging;
    dragging = null;
    if (mode === 'calibration') commitCalibration(c, 'manual_axis_adjusted');
    else commitGap(c, true);
  };
  canvas.onpointerleave = () => {
    canvas.style.cursor = 'default';
  };
  canvas.style.touchAction = 'none';
}

/**
 * Combined case chart: AC reference sine, phase gridlines, 0/360 markers,
 * the plot frame and the two gap lines.
 */
function drawSummaryChart(canvas, c, img) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);

  const gap = c.gap;
  const top = c.ai_top_class || '-';
  const topScore = c.ai_top_score_percent;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#1E293B';
  ctx.font = '11px "Courier New", monospace';
  ctx.fillText(c.prpd_filename || `${c.case_base_name}_PRPD.png`, w / 2, 16);
  ctx.fillText(
    `Top class: ${top}${topScore != null ? ` (${topScore.toFixed(2)}%)` : ''} | PD source: ${c.confirmed_pd_source_type || '-'}`,
    w / 2,
    32,
  );
  ctx.fillText(
    `Gap angle = ${gap.gap_angle_deg != null ? gap.gap_angle_deg.toFixed(4) : '-'} deg | Gap time = ${
      gap.gap_time_ms != null ? gap.gap_time_ms.toFixed(4) : '-'
    } ms | Band = ${gap.gap_time_band || '-'} | Severity = ${c.severity_by_gap_time || '-'}`,
    w / 2,
    48,
  );
  ctx.textAlign = 'left';

  const box = { x: 40, y: 60, w: w - 80, h: h - 130 };
  const imgW = c.image_width || 400;
  const imgH = c.image_height || 300;
  const imgScale = Math.min(box.w / imgW, box.h / imgH);
  const imgX = box.x + (box.w - imgW * imgScale) / 2;
  const imgY = box.y + (box.h - imgH * imgScale) / 2;
  const toX = (px) => imgX + px * imgScale;
  const toY = (px) => imgY + px * imgScale;

  const cal = c.calibration;
  const frame = {
    x_left: toX(cal.x_left_0deg ?? 0),
    x_right: toX(cal.x_right_360deg ?? imgW),
    y_top: toY(cal.y_top_plot ?? 0),
    y_bottom: toY(cal.y_bottom_plot ?? imgH),
  };
  const midY = (frame.y_top + frame.y_bottom) / 2;
  const halfH = (frame.y_bottom - frame.y_top) / 2;
  const spanX = frame.x_right - frame.x_left;
  const phaseX = (deg) => frame.x_left + (deg / 360) * spanX;

  if (img) {
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.drawImage(img, imgX, imgY, imgW * imgScale, imgH * imgScale);
    ctx.restore();
  }

  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  ctx.strokeRect(frame.x_left, frame.y_top, spanX, frame.y_bottom - frame.y_top);

  ctx.beginPath();
  ctx.strokeStyle = '#94A3B8';
  ctx.setLineDash([5, 3]);
  ctx.lineWidth = 1.3;
  for (let p = 0; p <= 360; p += 2) {
    const x = phaseX(p);
    const y = midY - Math.sin((p * Math.PI) / 180) * halfH * 0.92;
    if (p === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = '#CBD5E1';
  ctx.setLineDash([2, 3]);
  ctx.lineWidth = 1;
  [90, 180, 270].forEach((p) => {
    ctx.beginPath();
    ctx.moveTo(phaseX(p), frame.y_top);
    ctx.lineTo(phaseX(p), frame.y_bottom);
    ctx.stroke();
  });
  ctx.setLineDash([]);

  ctx.strokeStyle = '#3B82F6';
  ctx.setLineDash([6, 4]);
  ctx.lineWidth = 1.6;
  [frame.x_left, frame.x_right].forEach((x) => {
    ctx.beginPath();
    ctx.moveTo(x, frame.y_top);
    ctx.lineTo(x, frame.y_bottom);
    ctx.stroke();
  });
  ctx.setLineDash([]);

  ctx.strokeStyle = '#F59E0B';
  ctx.lineWidth = 1.6;
  ctx.setLineDash([8, 4]);
  [frame.y_top, frame.y_bottom].forEach((y) => {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  });
  ctx.setLineDash([]);

  if (gap.left_phase_deg != null && gap.right_phase_deg != null) {
    const xL = phaseX(gap.left_phase_deg);
    const xR = phaseX(gap.right_phase_deg);
    ctx.strokeStyle = '#DC2626';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(xL, frame.y_top);
    ctx.lineTo(xL, frame.y_bottom);
    ctx.stroke();
    ctx.strokeStyle = '#16A34A';
    ctx.beginPath();
    ctx.moveTo(xR, frame.y_top);
    ctx.lineTo(xR, frame.y_bottom);
    ctx.stroke();
  }

  ctx.fillStyle = '#64748B';
  ctx.font = '10px Kanit, sans-serif';
  ctx.textAlign = 'center';
  [0, 90, 180, 270, 360].forEach((p) => ctx.fillText(String(p), phaseX(p), frame.y_bottom + 16));
  ctx.fillText('Phase [°]', (frame.x_left + frame.x_right) / 2, h - 8);
  ctx.save();
  ctx.translate(16, midY);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillText('Amplitude', 0, 0);
  ctx.restore();
  ctx.textAlign = 'left';

  const legend = [
    { label: 'Current plot frame', color: '#F59E0B', dash: [6, 3] },
    { label: '0 / 360 deg', color: '#3B82F6', dash: [5, 3] },
    { label: '90/180/270 deg', color: '#94A3B8', dash: [2, 3] },
    { label: 'Left gap line', color: '#DC2626', dash: [] },
    { label: 'Right gap line', color: '#16A34A', dash: [] },
  ];
  const boxW = 152;
  const boxH = legend.length * 16 + 12;
  const boxX = frame.x_right - boxW - 6;
  const boxY = frame.y_top + 6;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.strokeStyle = '#CBD5E1';
  ctx.lineWidth = 1;
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeRect(boxX, boxY, boxW, boxH);
  legend.forEach((it, i) => {
    const ly = boxY + 14 + i * 16;
    ctx.strokeStyle = it.color;
    ctx.lineWidth = 2;
    ctx.setLineDash(it.dash);
    ctx.beginPath();
    ctx.moveTo(boxX + 8, ly);
    ctx.lineTo(boxX + 28, ly);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#334155';
    ctx.font = '10px Kanit, sans-serif';
    ctx.fillText(it.label, boxX + 34, ly + 3);
  });
}

function initUi(route) {
  if (route.name === 'login') return { mode: 'login', username: '', password: '', role: 'researcher' };
  if (route.name === 'dashboard' || route.name === 'batch') return { dateFilter: 'all', severityFilter: 'all' };
  if (route.name === 'cases')
    return {
      mode: route.mode || 'single',
      prpd: { file: null, preview: null, rejected: null, name: '' },
      tf: { file: null, preview: null, rejected: null, name: '' },
      uploading: false,
      showChecklist: false,
      acceptedChecklist: false,
      resumeMode: true,
      defectFilter: '',
    };
  if (route.name === 'settings') {
    const draft = {};
    Object.keys(state.thresholds.effective).forEach((k) => {
      draft[k] = String(state.thresholds.effective[k]);
    });
    return { draft };
  }
  return {};
}

function applyCaseToUi(c) {
  const u = state.ui;
  u.frame = {
    x_left: c.calibration.x_left_0deg ?? 0,
    x_right: c.calibration.x_right_360deg ?? (c.image_width || 400),
    y_top: c.calibration.y_top_plot ?? 0,
    y_bottom: c.calibration.y_bottom_plot ?? (c.image_height || 300),
  };
  u.gapLines = { left: c.gap.left_line_pixel, right: c.gap.right_line_pixel };
  u.reviewStatus = c.review_status;
  u.reviewNote = c.review_note || '';
  if (c.not_measurable_reason) u.notMeasurableReason = c.not_measurable_reason;
  if (!u.notMeasurableReason) u.notMeasurableReason = 'single_discharge_cluster';
  u.matchedPreset = matchingPreset(c);
}

function goTo(name, extra) {
  state.route = { name, ...(extra || {}) };
  state.ui = initUi(state.route);
  if (name === 'cases' && extra && extra.mode) state.ui.mode = extra.mode;
  render();
  window.scrollTo({ top: 0 });
}

function render() {
  const root = document.getElementById('root');
  if (!state.user) {
    root.innerHTML = loginHTML();
    return;
  }
  let content = '';
  switch (state.route.name) {
    case 'dashboard':
      content = viewDashboard();
      break;
    case 'cases':
      content = viewCases();
      break;
    case 'batch':
      content = viewBatch();
      break;
    case 'case':
      content = viewCase();
      break;
    case 'training':
      content = viewTraining();
      break;
    case 'settings':
      content = viewSettings();
      break;
    default:
      content = viewDashboard();
  }
  root.innerHTML = shellHTML(content);
  afterRender();
}

/** Canvas mounting, the equivalent of the components' effects. */
function afterRender() {
  if (state.route.name !== 'case' || state.ui.loading) return;
  const c = currentCase();
  if (!c) return;

  const preview = document.getElementById('prpdPreview');
  const calib = document.getElementById('calibCanvas');
  const gapCv = document.getElementById('gapCanvas');
  const summary = document.getElementById('summary-canvas');
  if (!preview && !calib && !gapCv && !summary) return;

  ensureImage(c, (img) => {
    if (preview && img) {
      preview.src = img.toDataURL ? img.toDataURL('image/png') : img.src;
    }
    if (calib) {
      drawPrpdCanvas(calib, c, 'calibration', img);
      attachCanvasDrag(calib, c, 'calibration', img);
    }
    if (gapCv) {
      drawPrpdCanvas(gapCv, c, 'gap', img);
      attachCanvasDrag(gapCv, c, 'gap', img);
    }
    if (summary) drawSummaryChart(summary, c, img);
  });
}

/* =========================================================================
   ANALYSIS
   ========================================================================= */
/** Runs the pipeline on a case imported from a folder but never opened. */
function runAnalysis(c) {
  const a = c._analysis;
  if (a) {
    Object.keys(a).forEach((k) => {
      c[k] = clone(a[k]);
    });
    delete c._analysis;
  }
  c.analysis_run = true;
  if (c.status === 'pending') c.status = 'in_review';
  c.severity_by_gap_time = severityFrom(c.gap.gap_time_ms, c.confirmed_pd_source_type);
  c.severity_group = severityGroupLabel(c.confirmed_pd_source_type);
  logUsage('analyze', `${c.case_base_name} · ${c.ai_input_mode || 'PRPD_ONLY'}`);
}

/** Queues a folder-imported case: the pipeline runs when it is first opened. */
function toPending(c) {
  c._analysis = {
    ai_top_class: c.ai_top_class,
    ai_top_score_percent: c.ai_top_score_percent,
    ai_final_result: c.ai_final_result,
    ai_final_score_percent: c.ai_final_score_percent,
    ai_status: c.ai_status,
    ai_high_conf_count: c.ai_high_conf_count,
    ai_non_identified_percent: c.ai_non_identified_percent,
    ai_decision_rule: c.ai_decision_rule,
    ai_threshold_percent: c.ai_threshold_percent,
    confidence: c.confidence,
    pd_rule_class: c.pd_rule_class,
    pd_selection_rule: c.pd_selection_rule,
    is_strong_pd_rule: c.is_strong_pd_rule,
    suggested_pd_source_type: c.suggested_pd_source_type,
    confirmed_pd_source_type: c.confirmed_pd_source_type,
    severity_by_gap_time: c.severity_by_gap_time,
    severity_group: c.severity_group,
    gap: clone(c.gap),
  };
  [
    'ai_top_class',
    'ai_final_result',
    'ai_status',
    'ai_decision_rule',
    'pd_rule_class',
    'pd_selection_rule',
    'suggested_pd_source_type',
    'confirmed_pd_source_type',
    'severity_by_gap_time',
    'ai_top_score_percent',
    'ai_final_score_percent',
    'ai_high_conf_count',
    'ai_non_identified_percent',
    'ai_threshold_percent',
  ].forEach((k) => {
    c[k] = null;
  });
  c.is_strong_pd_rule = null;
  c.severity_group = 'Unknown group';
  c.confidence = { corona: null, surface: null, internal: null };
  c.gap = {
    ...c.gap,
    left_line_pixel: null,
    right_line_pixel: null,
    left_phase_deg: null,
    right_phase_deg: null,
    gap_angle_deg: null,
    gap_time_ms: null,
    gap_time_band: null,
    gap_measurement_status: null,
    gap_line_source: null,
    detected_case: null,
    cluster_detection_status: null,
    auto_not_measurable_recommended: null,
    auto_not_measurable_reason: null,
  };
  c.analysis_run = false;
  c.status = 'pending';
  return c;
}

function openCase(id, from, batchId) {
  const c = state.cases.find((x) => x.id === id);
  if (!c) return;
  state.route = { name: 'case', id, from: from || null, batch: batchId || null };
  state.ui = { step: 'classification', loading: true, saving: false };
  render();
  window.scrollTo({ top: 0 });
  setTimeout(() => {
    if (!c.analysis_run) runAnalysis(c);
    state.ui.loading = false;
    applyCaseToUi(c);
    render();
  }, 420);
}

function caseGoBack() {
  const r = state.route;
  if (r.from === 'batch' && r.batch) goTo('batch', { id: r.batch });
  else if (r.from === 'queue') goTo('cases', { mode: 'folder' });
  else goTo('cases', { mode: 'single' });
}

/* =========================================================================
   UPLOAD  (single case + folder import)
   ========================================================================= */
function slotMismatch(slot, filename) {
  const lower = filename.toLowerCase();
  const saysPrpd = /prpd|pattern/.test(lower);
  const saysTf = /tf|twmap/.test(lower);
  if (slot === 'prpd' && saysTf && !saysPrpd)
    return `"${filename}" looks like a TF map, not a PRPD image. Upload it in the TF map slot instead.`;
  if (slot === 'tf' && saysPrpd && !saysTf)
    return `"${filename}" looks like a PRPD image, not a TF map. Upload it in the PRPD slot instead.`;
  return null;
}

function acceptFile(slot, file) {
  if (!file) return;
  const u = state.ui;
  u.showChecklist = false;
  u.acceptedChecklist = false;
  const ext = `.${(file.name.split('.').pop() || '').toLowerCase()}`;
  const target = slot === 'prpd' ? 'prpd' : 'tf';

  if (!ALLOWED_EXT.includes(ext) || !file.type.startsWith('image/')) {
    u[target] = { file: null, preview: null, name: '', rejected: `"${file.name}" (${ext || '?'}) is not a supported image type` };
    toast(`Rejected "${file.name}": unsupported file type`);
    render();
    return;
  }
  const mismatch = slotMismatch(slot, file.name);
  if (mismatch) {
    u[target] = { file: null, preview: null, name: '', rejected: mismatch };
    toast(`Rejected "${file.name}": wrong upload slot`);
    render();
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    u[target] = { file, name: file.name, preview: reader.result, rejected: null };
    render();
  };
  reader.readAsDataURL(file);
}

/** Reads the natural size of a data URL, so the case carries a real image size. */
function imageSize(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve({ w: 388, h: 281 });
    img.src = dataUrl;
  });
}

function baseNameOf(filename) {
  return filename.replace(/\.[^.]+$/, '').replace(/_(PRPD|TF|TWMAP|pattern)$/i, '');
}

/**
 * Scores a newly uploaded image. Without the .keras models in the browser the
 * scores are derived deterministically from the file, then run through the
 * real decision rules, so every downstream number stays internally consistent.
 */
function scoreImage(name, hybrid) {
  const rnd = mulberry32(hashString(name + (hybrid ? '_H' : '_P')));
  const lead = 40 + rnd() * 58;
  const second = Math.max(2, lead * (0.15 + rnd() * 0.45));
  const third = Math.max(1, second * (0.2 + rnd() * 0.6));
  const order = ['Corona', 'Surface', 'Internal'];
  const pick = Math.floor(rnd() * 3);
  const values = {};
  values[order[pick]] = lead;
  values[order[(pick + 1) % 3]] = second;
  values[order[(pick + 2) % 3]] = third;
  return {
    corona: round2(values.Corona),
    surface: round2(values.Surface),
    internal: round2(values.Internal),
  };
}

async function createCaseFromUpload(prpdSlot, tfSlot, batchId, defectName) {
  const size = await imageSize(prpdSlot.preview);
  const base = baseNameOf(prpdSlot.name);
  const hybrid = !!(tfSlot && tfSlot.preview);
  const conf = scoreImage(prpdSlot.name, hybrid);
  const decision = decideTopClass30(conf.corona, conf.surface, conf.internal);
  const identified = decision.ai_final_result !== 'Non-identified';
  const pd = identified
    ? selectPdSource(conf.corona, conf.surface, conf.internal)
    : {
        pd_rule_class: 'Non-identified',
        pd_source_type: 'Manual confirmation required',
        pd_selection_rule: 'all_classes_le_30_manual_confirmation_required',
        is_strong_rule: false,
      };

  const defaults = options().constants.default_frame;
  const sameSize = size.w === options().constants.default_image_width && size.h === options().constants.default_image_height;
  const frame = sameSize
    ? { ...defaults }
    : {
        x_left_0deg: Math.round(size.w * 0.19),
        x_right_360deg: Math.round(size.w * 0.9),
        y_top_plot: Math.round(size.h * 0.06),
        y_bottom_plot: Math.round(size.h * 0.83),
      };

  const now = new Date().toISOString();
  const c = {
    id: state.nextCaseId++,
    batch_id: batchId,
    status: 'in_review',
    decision_mode: 'topclass30',
    analysis_run: true,
    inference_engine: 'real',
    n_files: hybrid ? 2 : 1,
    record_id: base,
    case_base_name: base,
    defect_id: null,
    defect_name: defectName || null,
    prpd_filename: prpdSlot.name,
    tf_filename: hybrid ? tfSlot.name : null,
    prpd_url: null,
    tf_url: null,
    ai_mode: hybrid ? 'HYBRID' : 'PRPD_ONLY',
    ai_input_mode: hybrid ? 'HYBRID_PRPD_TF' : 'PRPD_ONLY',
    ai_model_used: hybrid ? 'Model 3: PRPD_3_Hybrid' : 'Model 2: PRPD_2_Only',
    ...decision,
    confidence: conf,
    pd_rule_class: pd.pd_rule_class,
    pd_selection_rule: pd.pd_selection_rule,
    is_strong_pd_rule: pd.is_strong_rule,
    suggested_pd_source_type: pd.pd_source_type,
    confirmed_pd_source_type: pd.pd_source_type,
    image_width: size.w,
    image_height: size.h,
    default_size_match: sameSize,
    calibration: {
      ...frame,
      calibration_mode: sameSize ? 'Use default PDProcessingII calibration' : 'Use auto-detected calibration',
      calibration_source: sameSize ? 'default_PDProcessingII' : 'auto_contour_detected',
      auto_calibration_status: 'auto_contour_detected',
      calibration_preset_loaded: false,
      calibration_preset_path: null,
    },
    gap: {
      left_line_pixel: null,
      right_line_pixel: null,
      left_phase_deg: null,
      right_phase_deg: null,
      gap_angle_deg: null,
      gap_time_ms: null,
      gap_time_band: null,
      gap_measurement_status: null,
      gap_line_source: null,
      auto_gap_status: null,
      auto_left_line_pixel: null,
      auto_right_line_pixel: null,
      auto_gap_model_available: true,
      auto_gap_model_version: 'auto_gap_time_abstract_v1',
      rule_based_status: null,
      cluster_detection_status: null,
      manual_adjustment_detected: false,
      auto_not_measurable_recommended: null,
      auto_not_measurable_reason: null,
      detected_case: null,
      positive_x_range_pixel: null,
      negative_x_range_pixel: null,
    },
    severity_by_gap_time: null,
    severity_group: severityGroupLabel(pd.pd_source_type),
    review_status: 'user_confirmed',
    reviewer_name: null,
    reviewer_role: null,
    review_note: null,
    not_measurable_reason: null,
    created_time: now,
    updated_time: now,
    annotated_image_url: null,
    input_quality: {
      input_check_status: sameSize ? 'passed' : 'warning',
      input_has_warning: !sameSize,
      input_warning_count: sameSize ? 0 : 1,
      input_warnings: sameSize
        ? []
        : [
            `image size ${size.w}x${size.h} differs from the default calibration size ${options().constants.default_image_width}x${
              options().constants.default_image_height
            }, so auto-calibration may be inaccurate`,
          ],
      user_confirmed_input_warning: false,
      plot_frame_detected: true,
      plot_area_ratio: 0.6,
      plot_area_status: 'plot_area_ok',
      pair_filename_match: hybrid ? baseNameOf(tfSlot.name) === base : null,
    },
    sanity_check: { ran: false, passed: null, upper_ratio: null, lower_ratio: null, left_ratio: null, right_ratio: null },
    _dataUrl: prpdSlot.preview,
  };

  state.cases.push(c);

  // The frame the analysis ran with, then the rule-based gap pass, exactly as
  // the API does before it hands the case to the review workflow.
  await new Promise((resolve) => {
    ensureImage(c, (img) => {
      const det = autoDetectFrame(c, img);
      if (det.frame) {
        c.calibration.x_left_0deg = det.frame.x_left;
        c.calibration.x_right_360deg = det.frame.x_right;
        c.calibration.y_top_plot = det.frame.y_top;
        c.calibration.y_bottom_plot = det.frame.y_bottom;
      }
      c.calibration.auto_calibration_status = det.status;
      const res = detectClusters(c, img, {
        x_left: c.calibration.x_left_0deg,
        x_right: c.calibration.x_right_360deg,
        y_top: c.calibration.y_top_plot,
        y_bottom: c.calibration.y_bottom_plot,
      });
      applyDetection(c, res, 'rule');
      resolve();
    });
  });
  return c;
}

function applyDetection(c, res, method) {
  if (res.single) {
    applyGap(
      c,
      {
        left_line_pixel: null,
        right_line_pixel: null,
        left_phase_deg: null,
        right_phase_deg: null,
        gap_angle_deg: null,
        gap_time_ms: null,
        gap_time_band: 'Not measurable',
      },
      {
        gap_measurement_status: 'not_measurable',
        cluster_detection_status: res.status,
        detected_case: res.status,
        auto_not_measurable_recommended: true,
        auto_not_measurable_reason: res.reason,
        auto_gap_status: 'auto_not_measurable',
        gap_line_source: method === 'model' ? 'ai_auto' : 'rule_based',
        rule_based_status: res.status,
      },
    );
    c.severity_by_gap_time = 'Not measurable';
    return;
  }
  // The regression model proposes marginally different boundaries from the
  // rule-based pass; both are only starting positions for the reviewer.
  const shift = method === 'model' ? 2 : 0;
  const left = res.left - shift;
  const right = res.right + shift;
  applyGap(c, computeGapMetrics(c, left, right), {
    gap_measurement_status: 'auto_detected',
    gap_line_source: method === 'model' ? 'ai_auto' : 'rule_based',
    auto_gap_status: 'auto_detected_positive_negative',
    rule_based_status: res.status,
    cluster_detection_status: res.status,
    detected_case: res.status,
    positive_x_range_pixel: res.positive_x_range_pixel,
    negative_x_range_pixel: res.negative_x_range_pixel,
    auto_left_line_pixel: round2(left),
    auto_right_line_pixel: round2(right),
    auto_not_measurable_recommended: false,
    auto_not_measurable_reason: null,
    manual_adjustment_detected: false,
  });
}

async function runUploadAnalysis() {
  const u = state.ui;
  if (!u.prpd.file) {
    toast('Select a PRPD image first');
    return;
  }
  u.uploading = true;
  render();
  const batchId = state.nextBatchId++;
  state.batches.push({
    id: batchId,
    batch_key: `B-SINGLE-${batchId}`,
    name: u.prpd.name,
    is_single: true,
    upload_date: new Date().toISOString(),
    created_by: state.user.username,
  });
  const c = await createCaseFromUpload(u.prpd, u.tf, batchId, null);
  logUsage('upload_case', u.tf.file ? `${u.prpd.name} + ${u.tf.name}` : u.prpd.name);
  logUsage('analyze', `${c.case_base_name} · ${c.ai_input_mode}`);
  u.uploading = false;
  toast(`Analysis complete for ${c.case_base_name}`);
  openCase(c.id, null, null);
}

async function importFolder(files) {
  if (!files || files.length === 0) return;
  const u = state.ui;
  u.uploading = true;
  render();

  const first = files[0];
  const folderName = (first.webkitRelativePath || '').split('/')[0] || `Folder import ${new Date().toLocaleDateString('en-GB')}`;

  // Pair by case key: <case>_PRPD.jpg + <case>_TF.jpg become one Hybrid case.
  const pairs = {};
  const rejected = [];
  Array.from(files).forEach((f) => {
    const ext = `.${(f.name.split('.').pop() || '').toLowerCase()}`;
    if (!ALLOWED_EXT.includes(ext)) {
      rejected.push(f.name);
      return;
    }
    const key = baseNameOf(f.name);
    pairs[key] = pairs[key] || { prpd: null, tf: null };
    if (/_tf|twmap/i.test(f.name)) pairs[key].tf = f;
    else pairs[key].prpd = f;
  });

  const keys = Object.keys(pairs).filter((k) => pairs[k].prpd);
  if (keys.length === 0) {
    u.uploading = false;
    toast('No supported PRPD images found in that folder');
    render();
    return;
  }

  const batchId = state.nextBatchId++;
  state.batches.push({
    id: batchId,
    batch_key: `B-${Date.now()}`,
    name: folderName,
    is_single: false,
    upload_date: new Date().toISOString(),
    created_by: state.user.username,
  });

  const readAs = (file) =>
    new Promise((resolve) => {
      const r = new FileReader();
      r.onload = () => resolve({ file, name: file.name, preview: r.result, rejected: null });
      r.onerror = () => resolve(null);
      r.readAsDataURL(file);
    });

  for (const key of keys) {
    const prpdSlot = await readAs(pairs[key].prpd);
    const tfSlot = pairs[key].tf ? await readAs(pairs[key].tf) : null;
    if (!prpdSlot) continue;
    // A folder import is queued, not analysed, until the case is opened.
    toPending(await createCaseFromUpload(prpdSlot, tfSlot, batchId, null));
  }

  logUsage('upload_folder', `${folderName} (${keys.length} cases)`);
  u.uploading = false;
  toast(`Imported ${keys.length} case(s)${rejected.length ? `, ${rejected.length} rejected` : ''}`);
  if (rejected.length) console.warn('Rejected files:', rejected);
  render();
}

/* =========================================================================
   CASE ACTIONS
   ========================================================================= */
function commitCalibration(c, source) {
  const f = state.ui.frame;
  const before = `${c.calibration.x_left_0deg} / ${c.calibration.x_right_360deg} / ${c.calibration.y_top_plot} / ${c.calibration.y_bottom_plot}`;
  c.calibration.x_left_0deg = f.x_left;
  c.calibration.x_right_360deg = f.x_right;
  c.calibration.y_top_plot = f.y_top;
  c.calibration.y_bottom_plot = f.y_bottom;
  c.calibration.calibration_source = source;
  if (source === 'manual_axis_adjusted') c.calibration.calibration_mode = 'Manual calibration';
  const after = `${f.x_left} / ${f.x_right} / ${f.y_top} / ${f.y_bottom}`;
  if (before !== after) logEdit(c.case_base_name, 'calibration_frame', before, after);
  if (c.gap.left_line_pixel != null && c.gap.right_line_pixel != null)
    applyGap(c, computeGapMetrics(c, c.gap.left_line_pixel, c.gap.right_line_pixel));
  c.updated_time = new Date().toISOString();
  render();
}

function commitGap(c, manual) {
  const g = state.ui.gapLines;
  if (g.left == null || g.right == null) return;
  const before = `${c.gap.left_line_pixel} / ${c.gap.right_line_pixel}`;
  applyGap(c, computeGapMetrics(c, g.left, g.right), {
    gap_line_source: manual ? 'manual' : c.gap.gap_line_source,
    gap_measurement_status: manual ? 'manually_adjusted' : c.gap.gap_measurement_status,
    manual_adjustment_detected: manual ? true : c.gap.manual_adjustment_detected,
  });
  logEdit(c.case_base_name, 'gap_lines', before, `${g.left} / ${g.right}`);
  render();
}

function detectGap(method) {
  const c = currentCase();
  ensureImage(c, (img) => {
    const res = detectClusters(c, img, {
      x_left: c.calibration.x_left_0deg,
      x_right: c.calibration.x_right_360deg,
      y_top: c.calibration.y_top_plot,
      y_bottom: c.calibration.y_bottom_plot,
    });
    applyDetection(c, res, method);
    state.ui.gapLines = { left: c.gap.left_line_pixel, right: c.gap.right_line_pixel };
    if (res.single) toast('Only one discharge cluster found, so gap-time is not measurable');
    else toast(`Gap lines placed via ${method === 'model' ? 'regression model' : 'rule-based detection'}`);
    render();
  });
}

function submitReview(statusOverride) {
  const c = currentCase();
  const u = state.ui;
  const status = statusOverride || u.reviewStatus;
  const notMeasurable = status === 'not_measurable';

  if (!notMeasurable) {
    const [ok, message] = validateGapTimeResult(c);
    if (!ok) {
      toast(message);
      return false;
    }
  }

  logEdit(c.case_base_name, 'review_status', c.review_status, status);
  c.review_status = status;
  u.reviewStatus = status;
  c.review_note = u.reviewNote || null;
  c.not_measurable_reason = notMeasurable ? u.notMeasurableReason : null;
  c.reviewer_name = state.user.username;
  c.reviewer_role = state.user.role;
  c.status = 'done';
  if (notMeasurable) {
    c.gap.gap_time_band = 'Not measurable';
    c.gap.gap_measurement_status = 'not_measurable';
    c.severity_by_gap_time = 'Not measurable';
  } else if (c.gap.left_line_pixel != null) {
    applyGap(c, computeGapMetrics(c, c.gap.left_line_pixel, c.gap.right_line_pixel));
  }
  c.annotated_image_url = c.annotated_image_url || `/api/v1/files/by_image/${c.case_base_name}_annotated_gap_time.png`;
  c.updated_time = new Date().toISOString();
  logUsage('save_review', `${c.case_base_name} (${c.review_status})`);
  toast(`Saved results for ${c.case_base_name} (${c.review_status})`);
  render();
  return true;
}

function nextPendingCase(c) {
  const siblings = siblingsOf(c);
  const idx = siblings.findIndex((s) => s.id === c.id);
  if (idx < 0) return null;
  for (let i = 1; i <= siblings.length; i += 1) {
    const cand = siblings[(idx + i) % siblings.length];
    if (cand && cand.id !== c.id && cand.status !== 'done') return cand;
  }
  return null;
}

function advance() {
  const c = currentCase();
  const next = nextPendingCase(c);
  if (!next) {
    toast('All cases in this queue are reviewed');
    caseGoBack();
    return;
  }
  openCase(next.id, state.route.from, state.route.batch);
}

function toCsv(columns, rows) {
  const cell = (v) => {
    if (v === null || v === undefined || v === false) return v === false ? 'False' : '';
    if (v === true) return 'True';
    const s = String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  return [columns.join(','), ...rows.map((r) => columns.map((k) => cell(r[k])).join(','))].join('\r\n');
}

function downloadText(filename, text) {
  const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function runExport(kind) {
  const reviewed = state.cases.filter((c) => c.status === 'done').map(flatCase);
  const cols = SEED.columns;
  if (kind === 'master') downloadText('final_summary.csv', toCsv(cols.master, reviewed));
  else if (kind === 'workbook') downloadText('master_workbook.csv', toCsv(cols.workbook, reviewed));
  else if (kind === 'short') downloadText('final_summary_short.csv', toCsv(cols.short, reviewed));
  else downloadText('edit_history.csv', toCsv(cols.edits, state.editHistory));
  logUsage(`export_${kind}`, `${kind === 'edits' ? state.editHistory.length : reviewed.length} rows`);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    // Clicking outside the help popover closes it, as in the React version.
    if (state.helpOpen && !e.target.closest('.help-popover')) {
      state.helpOpen = false;
      render();
    }
    return;
  }
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el, e);
  else if (state.helpOpen && !e.target.closest('.help-popover') && !e.target.closest('[data-help-trigger]')) {
    state.helpOpen = false;
    render();
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'prpdFileInput') return acceptFile('prpd', el.files[0]);
  if (el.id === 'tfFileInput') return acceptFile('tf', el.files[0]);
  if (el.id === 'folderInput') return void importFolder(el.files);
  const act = el.dataset.act;
  if (!act) return;
  const c = state.route.name === 'case' ? currentCase() : null;

  switch (act) {
    case 'filter-date':
      state.ui.dateFilter = el.value;
      render();
      break;
    case 'filter-severity':
      state.ui.severityFilter = el.value;
      render();
      break;
    case 'resume-mode':
      state.ui.resumeMode = el.checked;
      render();
      break;
    case 'defect-filter':
      state.ui.defectFilter = el.value;
      render();
      break;
    case 'accept-checklist':
      state.ui.acceptedChecklist = el.checked;
      render();
      break;
    case 'pd-source': {
      const before = c.confirmed_pd_source_type;
      c.confirmed_pd_source_type = el.value;
      c.severity_group = severityGroupLabel(el.value);
      c.severity_by_gap_time = severityFrom(c.gap.gap_time_ms, el.value);
      logEdit(c.case_base_name, 'confirmed_pd_source_type', before, el.value);
      c.updated_time = new Date().toISOString();
      render();
      break;
    }
    case 'calib-input':
      state.ui.frame[el.dataset.key] = Number(el.value);
      commitCalibration(c, 'manual_axis_adjusted');
      break;
    case 'review-status':
      state.ui.reviewStatus = el.value;
      render();
      break;
    case 'nm-reason':
      state.ui.notMeasurableReason = el.value;
      break;
    case 'review-note':
      state.ui.reviewNote = el.value;
      break;
    default:
      break;
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.act === 'threshold-input') {
    state.ui.draft[el.dataset.key] = el.value;
  } else if (el.dataset.act === 'review-note') {
    state.ui.reviewNote = el.value;
  } else if (el.id === 'authUsername' || el.id === 'authPassword') {
    readLoginInputs();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.helpOpen) {
    state.helpOpen = false;
    render();
    return;
  }
  const el = e.target;
  if ((el.id === 'authUsername' || el.id === 'authPassword') && e.key === 'Enter') submitAuth();
});

// Caps Lock is read on key-up, so the character just typed is already in the
// field when the warning re-renders it.
document.addEventListener('keyup', (e) => {
  const el = e.target;
  if (el.id !== 'authPassword' || typeof e.getModifierState !== 'function') return;
  const caps = e.getModifierState('CapsLock');
  if (caps === !!state.ui.capsLock) return;
  readLoginInputs();
  state.ui.capsLock = caps;
  render();
  const pw = document.getElementById('authPassword');
  if (pw) {
    pw.focus();
    pw.setSelectionRange(pw.value.length, pw.value.length);
  }
});
